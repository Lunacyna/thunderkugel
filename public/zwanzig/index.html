<style>
/* Layout: Lunacynas Nachtzimmer – links die Karte mit 20 Feldern wie Bilderrahmen an der Wand, rechts der Punktestand. Bewusst nur dunkel. */
:root{

}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}

}

.navr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--font-body);font-weight:700;font-size:15px;border:0;border-radius:999px;padding:11px 20px;cursor:pointer;background:var(--moon);color:var(--btn-ink);
  box-shadow:0 4px 0 var(--moon-deep),0 0 18px rgba(var(--rgb-moon,253,213,187),.35);transition:transform .08s,box-shadow .15s;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover:not([disabled]){box-shadow:0 4px 0 var(--moon-deep),0 0 26px rgba(var(--rgb-moon,253,213,187),.6)}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--moon-deep)}

.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px rgba(var(--rgb-lav,185,166,232),.45)}

/* Spielfeld */

@media (max-width:560px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.tile{min-height:78px;padding:8px}.tile.act .tx{font-size:9.5px;letter-spacing:.04em}.tile.open .tx{font-size:11.5px}}

.answer{font-family:var(--font-script);font-weight:700;font-size:clamp(52px,8vw,92px);line-height:1;color:var(--neon);text-shadow:0 0 8px var(--glow),0 0 30px rgba(var(--rgb-glow,199,125,255),.6);margin:6px 0 10px}

.score{display:flex;flex-direction:column;gap:4px}
.sc{padding:10px 10px;border-radius:12px;border:2px solid transparent}

<script>window.KB_LOBBY='lobby-zw';
// Verbindung zum Kugelblitz-Server (Cloudflare Durable Objects) per WebSocket.
// Stellt dieselbe Schnittstelle bereit, die das Spiel erwartet: window.claude.use("room"|"user").
(()=>{
  window.KB_SERVER=true;
  const rid=()=>Math.random().toString(36).slice(2,12).padEnd(10,'0');
  const peerId=rid();
  let uid=null;try{uid=localStorage.getItem('kb_uid')}catch(e){}
  if(!uid||!/^u_[a-z0-9]{10}$/.test(uid)){uid='u_'+rid();try{localStorage.setItem('kb_uid',uid)}catch(e){}}
  const ADJ=['Flinke','Schnelle','Wilde','Kluge','Mutige','Lustige','Wache','Freche','Coole','Starke','Fixe','Heitere'];
  const TIER=['Eule','Katze','Ente','Robbe','Maus','Biene','Kröte','Möwe','Ziege','Qualle','Hummel','Taube'];
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const newName=()=>pick(ADJ)+' '+pick(TIER);
  let myName=null;try{myName=localStorage.getItem('kb_name')}catch(e){}
  if(!myName||myName.length>30)myName=newName();
  const names={};names[uid]=myName;
  const verified=new Set();
  const auth={enabled:false,user:null};
  window.kbAuth=auth;
  const conns=new Set();
  const cleanName=s=>typeof s==='string'?s.replace(/[^\p{L}\p{N} ._-]/gu,'').slice(0,30):'';

  // Namen lernen: Twitch-bestätigte Namen (vom Server) haben Vorrang vor selbst gewählten
  function learn(by,vn,pr){if(!by)return;if(vn){names[by]=cleanName(vn);verified.add(by)}else if(!verified.has(by)&&pr&&pr.nm)names[by]=cleanName(pr.nm)}
  function conn(roomName){
    const peers=new Map();const listeners=new Set();const connL=new Set();
    let readyRes;const ready=new Promise(r=>readyRes=r);setTimeout(()=>readyRes(false),5000);
    let ws=null,open=false,closed=false,my={nm:myName},snap=null,sendTimer=null,notifyQ=false,retry=0;
    peers.set(peerId,{by:uid,pr:my,t:Date.now()});

function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').trim().replace(/^(der|die|das|the|ein|eine)\s+/,'').replace(/[^a-z0-9]/g,'')}

  const cur=G.order?G.order[G.tp]:-1,isCur=free||actor===cur,isVl=free||(G.vr?actor===G.vl:(G.pl[actor]&&G.pl[actor].p===G.hp));

      if(G.ph!=='pick'||!isCur)return null;const i=a.i|0,t=G.tiles[i];if(!t||t.o)return null;
      const tiles=G.tiles.map((x,j)=>j===i?{...x,o:true}:x),opened=G.opened+1;

}

function pub(G){

}

function hostTick(){

  if(ON.H.ph==='lobby')hostSyncLobby();

  if(['pick','guess','action'].includes(ON.H.ph)){
    const here=new Set(ON.gr.peers().map(p=>p.peer)),G=ON.H,cur=G.order[G.tp];
    const waitOn=[G.pl[cur]];if(G.ph==='guess'&&G.mode==='spoken'&&G.vr)waitOn.push(G.pl[G.vl]);
    const gone=waitOn.find(p=>p&&p.p&&!here.has(p.p));

}

function readHost(){
  if(!ON.gr)return;
  if(ON.host){ON.g=pub(ON.H);ON.hostSeenAt=Date.now();return}
  const peers=ON.gr.peers(),here=new Set(peers.map(p=>p.peer));
  const hp=peers.find(p=>p.presence&&p.presence.g&&typeof p.presence.g==='object');

const STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z" fill="#FDD5BB"/></svg>';
let lastMain='',lastSide='';
function segHtml(id,cur,opts,disabled){return `<div class="seg" data-seg="${id}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${String(cur)===String(v)}" ${disabled?'disabled':''}>${l}</button>`).join('')}</div>`}
function msgText(G,m){if(!m)return '';const n=esc(nameOf(G,m.i));
  if(m.k==='wrong')return `„${esc(m.g)}“ ist es leider nicht, ${n}.`;if(m.k==='pass')return `${n} passt.`;if(m.k==='no')return `Leider falsch, ${n}.`;if(m.k==='skip')return `${n} wurde übersprungen.`;return ''}

function viewMenu(){
  const on=!!NET.room,note=NET.state==='checking'?'Verbindung wird geprüft …':on?'Jede Person spielt am eigenen Gerät. Ideal mit Discord oder im Stream.':'Kein Spielserver gefunden. Online geht nur, wenn die Seite als Cloudflare Worker läuft.';
  return `<div class="panel sheet"><h2>Wie wollt ihr spielen?</h2>
    <div class="choices">
      <button class="choice" type="button" data-do="goOnline" ${on?'':'disabled'}><b>Online</b><span>${esc(note)}</span></button>
      <button class="choice" type="button" data-do="goLocal"><b>Am selben Bildschirm</b><span>Ein Gerät für alle – reihum klicken.${V.local&&V.local.ph?' Ein laufendes Spiel wird fortgesetzt.':''}</span></button>
    </div>${window.KB_SERVER?`<p class="hint">${CUSTOM.length?(CUSTOM.length===1?'1 eigene Karte ist':CUSTOM.length+' eigene Karten sind')+' dabei. ':''}<a href="/zwanzig/karten/" style="color:var(--neon);font-weight:700">Eigene Karten &amp; Vorschläge →</a></p>`:''}</div>`;
}
function settingsHtml(cfg,disabled){
  return `<div class="field"><span class="label">Schwierigkeit</span>${segHtml('diff',cfg.diff,diffs(),disabled)}<p class="hint">${cfg.diff==='normal'?'Bekannte Persönlichkeiten, Orte und Dinge.':cfg.diff==='hard'?'Knifflige Karten mit kniffligen Hinweisen – für Rate-Profis.':'Leichte und schwere Karten gemischt.'}</p></div>
    <div class="field"><span class="label">Gespielt wird bis</span>${segHtml('goal',cfg.goal,[[40,'40 Punkte'],[60,'60 Punkte'],[100,'100 Punkte']],disabled)}</div>
    <div class="field"><span class="label">Antworten</span>${segHtml('mode',cfg.mode,[['typed','Eintippen'],['spoken','Laut sagen']],disabled)}
      <p class="hint">${cfg.mode==='typed'?'Antworten werden eingetippt und automatisch geprüft – kleine Tippfehler sind okay.':'Antworten laut sagen (z. B. im Voice-Chat). Wer vorliest, sieht die Lösung und entscheidet.'}</p></div>
    <div class="field"><span class="label">Wer liest vor?</span>${segHtml('reader',cfg.mode==='spoken'?'person':(cfg.reader||'pc'),[['pc','Der Computer'],['person','Reihum eine Person']],disabled||cfg.mode==='spoken')}
      <p class="hint">${cfg.mode==='spoken'?'Beim lauten Antworten braucht es eine Person, die vorliest und entscheidet – sie wechselt jede Runde.':(cfg.reader||'pc')==='pc'?'Alle raten reihum. Wer errät, bekommt 20 minus geöffnete Felder.':'Wie beim Kartenspiel: Eine Person liest vor und bekommt die übrigen Punkte. Bei zwei Spielern rät dann immer dieselbe Person.'}</p></div>`;
}
function viewLocalSetup(){
  const s=V.setup;
  return `<div class="panel sheet"><h2>Am selben Bildschirm</h2>
    <div class="field"><span class="label">Mitspielende (2–6)</span>
      ${s.names.map((n,i)=>`<div class="namerow"><span class="num">${i+1}</span><input class="txt" id="nm${i}" data-name="${i}" value="${esc(n)}" placeholder="Person ${i+1}" maxlength="24" autocomplete="off">${s.names.length>2?`<button class="linkbtn" type="button" data-do="rmName" data-i="${i}">Entfernen</button>`:''}</div>`).join('')}
      ${s.names.length<6?`<div><button class="linkbtn" type="button" data-do="addName">+ Person hinzufügen</button></div>`:''}
    </div>
    ${settingsHtml(s,false)}
    <div class="row"><button class="btn" type="button" data-do="startLocal">Spiel starten</button><button class="btn ghost" type="button" data-do="menu">Zurück</button></div></div>`;
}
function twNameField(myNm){
  const a=window.kbAuth||{},me=window.kbName&&window.kbName.verified();
  if(me)return `<div class="field"><span class="label">Dein Name</span><div class="game"><div style="min-width:0"><div class="t">${esc(myNm)} <span class="vb" title="Mit Twitch angemeldet">✓ Twitch</span></div><div class="s">Dein Name ist mit Twitch bestätigt und zählt so für die Bestenliste.</div></div><a class="btn small ghost" href="/auth/logout?r=/zwanzig/">Abmelden</a></div></div>`;
  return `<div class="field"><span class="label">Dein Name</span><div class="namerow"><input class="txt" id="myName" value="${esc(myNm)}" maxlength="24" autocomplete="off"><button class="btn small ghost" type="button" data-do="saveName">Speichern</button></div>${a.enabled?`<div class="row"><a class="btn small twbtn" href="/auth/twitch/login?r=/zwanzig/">Mit Twitch einloggen</a><span class="hint">Bestätigter Name mit ✓ in der Bestenliste</span></div>`:''}</div>`;
}
function viewLobby(){
  const peers=NET.room?NET.room.peers():[];
  const games=peers.filter(p=>!p.sameTab&&p.presence&&p.presence.host&&typeof p.presence.host.code==='string'&&/^zw-[a-z0-9]{4}$/.test(p.presence.host.code));
  resolveNames(games.map(p=>p.by));
  const myNm=window.kbName?window.kbName.get():'';
  const list=games.length?games.map(p=>{const h=p.presence.host,n=Math.min(6,h.n|0),open=h.ph==='lobby'&&n<6;const d=(diffs().find(x=>x[0]===h.diff)||['',''])[1];
    return `<div class="game"><div style="min-width:0"><div class="t">Spiel von ${esc((p.by&&NET.names[p.by])||'jemandem')}</div><div class="s">${esc(d)} · bis ${h.goal|0} Punkte · ${n}/6 Spieler · ${open?'wartet':'läuft'}</div></div>
      <button class="btn small ${open?'':'ghost'}" type="button" data-do="join" data-code="${esc(h.code)}">${open?'Mitspielen':'Zuschauen'}</button></div>`}).join('')
    :`<div class="empty">Gerade ist kein offenes Spiel da. Eröffne eins – deine Mitspieler sehen es dann hier.</div>`;
  return `<div class="panel sheet"><div class="label">Online</div><h2>Spiel finden</h2>
    ${twNameField(myNm)}
    <div class="games">${list}</div>
    <div class="row"><button class="btn" type="button" data-do="create">Neues Spiel eröffnen</button><button class="btn ghost" type="button" data-do="menu">Zurück</button></div></div>`;
}
function viewWaiting(G,me){
  resolveNames((G.pl||[]).map(p=>p.b));
  const rows=(G.pl||[]).map((p,i)=>`<tr><td>${esc(nameOf(G,i))}${i===me?' (du)':''}${p.p===G.hp?' · Spielleitung':''}</td><td></td></tr>`).join('');
  const n=(G.pl||[]).length;
  if(ON.host)return `<div class="panel sheet"><div class="label">Warteraum · ${n}/6 Spieler</div><h2>Dein Online-Spiel</h2><table class="res">${rows}</table>
    ${settingsHtml(G,false)}<p>${n<2?'Warte auf Mitspieler: Sie öffnen diese Seite, wählen „Online“ und klicken bei deinem Spiel auf „Mitspielen“.':'Alle da? Dann los.'}</p>
    <div class="row"><button class="btn" type="button" data-do="hostStart" ${n<2?'disabled':''}>Spiel starten</button><button class="btn ghost" type="button" data-do="leave">Verlassen</button></div></div>`;
  return `<div class="panel sheet"><div class="label">Warteraum · ${n}/6 Spieler</div><h2>${me>=0?'Du bist dabei':'Du schaust zu'}</h2><table class="res">${rows}</table>
    ${settingsHtml(G,true)}<p>Die Spielleitung startet das Spiel.</p><div class="row"><button class="btn ghost" type="button" data-do="leave">Verlassen</button></div></div>`;
}
// me: eigener Index (online), -1 = Zuschauer, null = lokal (alle)
function viewBoard(G,me,ctl){
  const local=me===null,cur=G.order[G.tp],card=G.card;
  const isCur=local||me===cur,isVl=local||(G.vr?me===G.vl:(G.pl[me]&&G.pl[me].p===G.hp));
  const curName=esc(nameOf(G,cur)),vlName=esc(nameOf(G,G.vl));
  const t=G.cur!=null?G.tiles[G.cur]:null;
  let prompt='';
  const peekBtn=G.vr&&(!local||G.mode==='spoken')&&(local||me===G.vl)&&card?`<span class="peek" data-peek><button class="linkbtn" type="button" data-hold>Lösung (gedrückt halten)</button><span class="ans">${esc(card.answer)}</span></span>`:'';
  if(G.ph==='pick'){
    prompt=`<div class="label hot">Am Zug</div><div class="who">${isCur&&!local?'Du bist dran<em>, wähl eine Zahl.</em>':curName+'<em>, wähl eine Zahl.</em>'}</div>`;
    if(!isCur)prompt+=`<div class="wait" style="margin-top:10px"><span class="dots">${curName} überlegt</span></div>`;
    if(G.msg)prompt+=`<div class="msg">${msgText(G,G.msg)}</div>`;
    if(G.lw&&isVl&&G.mode==='typed')prompt+=`<div style="margin-top:8px"><button class="linkbtn" type="button" data-do="override">${G.vr&&local?'Vorleser·in: ':(!G.vr&&!local?'Spielleitung: ':'')}Das war doch richtig</button></div>`;
  }else if(G.ph==='guess'){
    prompt=`<div class="label hot">Hinweis ${t.num} · für ${curName}</div><div class="clue">${esc(t.t)}</div>`;
    if(G.mode==='typed'){
      if(isCur)prompt+=`<div class="guessrow"><input class="txt" id="guess" placeholder="Deine Antwort …" maxlength="60" autocomplete="off"><button class="btn" type="button" data-do="guess">Raten</button><button class="btn ghost" type="button" data-do="pass">Passen</button></div>`;
      else prompt+=`<div class="wait"><span class="dots">${curName} tippt eine Antwort</span></div>`;
    }else{
      if(isVl)prompt+=`<p class="hint" style="margin-bottom:12px">${local?curName+' sagt die Antwort laut – die Vorleser·in entscheidet.':curName+' sagt die Antwort laut. Du liest vor und entscheidest.'}</p>
        <div class="row"><button class="btn" type="button" data-do="right">Richtig</button><button class="btn ghost" type="button" data-do="wrong">Falsch</button></div>`;
      else prompt+=`<div class="wait"><span class="dots">${isCur?'Sag deine Antwort laut! '+vlName+' entscheidet':curName+' rät laut – '+vlName+' entscheidet'}</span></div>`;
      if(isCur&&!local&&!isVl)prompt+=`<div style="margin-top:10px"><button class="linkbtn" type="button" data-do="pass">Passen</button></div>`;
    }
  }else if(G.ph==='action'){
    prompt=`<div class="label hot">Sonderfeld ${t.num} · ${curName}</div><div class="clue">${esc(t.t)}</div>`;
    prompt+=isCur?`<button class="btn" type="button" data-do="cont">Weiter</button>`:`<div class="wait"><span class="dots">Warte auf ${curName}</span></div>`;
  }
  if(peekBtn)prompt+=`<div style="margin-top:14px">${peekBtn}</div>`;
  if(ctl&&!local&&['pick','guess','action'].includes(G.ph))prompt+=`<div style="margin-top:8px"><button class="linkbtn" type="button" data-do="skipTurn">Spielleitung: ${curName} überspringen</button></div>`;
  const canPick=G.ph==='pick'&&isCur;
  const tiles=G.tiles.map((x,i)=>{
    if(!x.o)return canPick?`<button class="tile closed" type="button" data-pick="${i}" aria-label="Feld ${x.num}"><span class="big">${x.num}</span></button>`:`<div class="tile closed"><span class="big">${x.num}</span></div>`;
    const curr=i===G.cur&&G.ph!=='pick';
    if(x.k==='a')return `<div class="tile act${curr?' current':''}"><span class="n">${x.num}</span><span class="tx">Sonderfeld</span>${STAR}</div>`;
    return `<div class="tile open${curr?' current':''}"><span class="n">${x.num}</span><span class="tx">${esc(x.t)}</span></div>`;
  }).join('');
  const log=G.mode==='typed'&&G.log.length?`<div class="log"><span class="label">Schon geraten</span>${G.log.map(l=>`<span class="g">„${esc(l.g)}“ <i>· ${esc(nameOf(G,l.i))}</i></span>`).join('')}</div>`:'';
  return `<div class="cardhead"><div><div class="label">Runde ${G.rd}${G.vr?` · Es liest vor: ${vlName}${!local&&me===G.vl?' (du)':''}`:' · Alle raten reihum'}</div><h2>Ich bin ${CAT[card.category]||'gesucht.'}</h2></div>
    <div class="pot"><b>${20-G.opened}</b><span class="label">Punkte im Topf</span></div></div>
    ${card.author?`<p class="credit">Community-Karte von ${esc(card.author)}${card.av?' <span class="vb" title="Mit Twitch bestätigt">✓</span>':''}</p>`:''}
    <div class="panel prompt" id="promptBox">${prompt}</div>
    <div class="tiles">${tiles}</div>${log}`;
}
function viewRoundEnd(G,me,ctl){
  const card=G.card,r=G.res,last=G.pl.some(p=>p.pts>=G.goal);
  const text=r.w!=null?`${esc(nameOf(G,r.w))} hat es nach ${r.opened} ${r.opened===1?'geöffnetem Feld':'geöffneten Feldern'} erraten.`:(G.vr?'Niemand ist draufgekommen – alle 20 Punkte gehen an die Vorleser·in.':'Niemand ist draufgekommen – die Punkte verfallen.');
  return `<div class="panel"><div class="label hot">Aufgelöst · Runde ${G.rd}</div><div class="answer">${esc(card.answer)}</div><p style="margin:0;font-size:19px">${text}</p>
    ${card.author?`<p class="credit big">Karte eingereicht von <b>${esc(card.author)}</b>${card.av?' <span class="vb" title="Mit Twitch bestätigt">✓</span>':''} – danke!</p>`:''}
    <div class="gains">${r.gains.length?'':'<div><b>+0</b><span class="label">für alle</span></div>'}${r.gains.map(g=>`<div><b>+${g.pts}</b><span class="label">${esc(nameOf(G,g.i))} · ${g.role}</span></div>`).join('')}</div>
    ${ctl?`<button class="btn" type="button" data-do="next">${last?'Zur Siegerehrung':'Nächste Karte'}</button>`:`<p class="hint">Die Spielleitung zieht gleich die nächste Karte.</p>`}
    <div class="label" style="margin-top:26px">Alle Hinweise dieser Karte</div>
    <div class="allhints">${G.tiles.filter(t=>t.k==='h').map(t=>`<div class="${t.o?'':'closed'}"><span>${t.num}</span>${esc(t.t)}</div>`).join('')}</div></div>`;
}
function viewGameEnd(G,me,ctl){
  const order=G.pl.map((p,i)=>({i,pts:p.pts})).sort((a,b)=>b.pts-a.pts),top=order.filter(o=>o.pts===order[0].pts);
  return `<div class="panel sheet" style="max-width:none"><div class="label hot">Spielende nach ${G.rd} Runden</div>
    <h2>${top.length>1?'Gleichstand!':esc(nameOf(G,top[0].i))+' gewinnt!'}</h2>
    <table class="res">${order.map((o,r)=>`<tr class="${o.pts===order[0].pts?'win':''}"><td>${r+1}. ${esc(nameOf(G,o.i))}${o.i===me?' (du)':''}</td><td>${o.pts} Punkte</td></tr>`).join('')}</table>
    <div class="row">${ctl?`<button class="btn" type="button" data-do="rematch">Revanche</button><button class="btn ghost" type="button" data-do="${me===null?'newSetup':'toLobby'}">Neu einrichten</button>`:'<p class="hint">Die Spielleitung kann eine Revanche starten.</p>'}${me!==null?`<button class="btn ghost" type="button" data-do="leave">Verlassen</button>`:''}</div></div>`;
}
function viewSide(G,me){
  if(!G||!G.pl||!G.pl.length||G.ph==='lobby'){
    return `<div class="panel"><h3>So geht's</h3><ol class="rules">
      <li>Gesucht ist eine Person, ein Ort oder ein Ding. Die Hinweise liest der Computer vor – oder reihum eine Person.</li>
      <li>Wer dran ist, wählt eine Zahl von 1 bis 20, bekommt einen Hinweis und darf einmal raten.</li>
      <li>Pro Karte gibt es 20 Punkte. Wer errät, bekommt 20 minus geöffnete Felder. Liest eine Person vor, bekommt sie den Rest.</li>
      <li>Drei Felder sind Sonderfelder: aussetzen, Punkte gewinnen, Punkte verlieren oder nochmal wählen.</li></ol>
      <p class="kbdhint"><b>Tastatur:</b> Zahl tippen <kbd class="lz-kbd">1</kbd>–<kbd class="lz-kbd">20</kbd> wählt ein Feld · <kbd class="lz-kbd">Pfeile</kbd> wandern über die Felder · <kbd class="lz-kbd">Leertaste</kbd> springt ins Antwortfeld · <kbd class="lz-kbd">Enter</kbd> bestätigt / weiter</p></div>`;
  }
  const playing=['pick','guess','action'].includes(G.ph),cur=G.order?G.order[G.tp]:-1;
  const peers=ON.gr&&me!==null?new Set(ON.gr.peers().map(p=>p.peer)):null;
  return `<div class="panel"><h3>Punktestand <span>Ziel ${G.goal}</span></h3><div class="score">${G.pl.map((p,i)=>{
    const role=G.vr&&i===G.vl?'Liest vor':(i===cur&&playing?'Am Zug':(p.sk?'Setzt aus':''));
    return `<div class="sc ${i===me?'me':''} ${peers&&p.p&&!peers.has(p.p)?'off':''}"><div class="top"><span class="nm">${esc(nameOf(G,i))}${p.b&&window.kbName&&window.kbName.isVerified&&window.kbName.isVerified(p.b)?' <span class="vb" title="Mit Twitch bestätigt">✓</span>':''}${i===me?' (du)':''}</span><span class="pt">${p.pts}</span></div>
      <div class="bar"><i style="width:${Math.min(100,Math.round(p.pts/G.goal*100))}%"></i></div>${role?`<span class="chip ${role==='Am Zug'?'hot':''}">${role}</span>`:''}${peers&&p.p&&!peers.has(p.p)?' <span class="chip">offline</span>':''}</div>`}).join('')}</div>${me===null?`<div style="margin-top:12px"><button class="linkbtn" type="button" data-do="newSetup">Neues Spiel einrichten</button></div>`:''}</div>`;
}

// Töne aus Zustandswechseln ableiten (gleich für lokal und online)
let sPrev=null;
function sounds(G,me){
  if(!G||!window.LZSound){sPrev=null;return}
  const sig={ph:G.ph,opened:G.opened||0,rd:G.rd||0,msg:G.msg?JSON.stringify(G.msg):'',cur:G.order?G.order[G.tp]:-1,n:(G.pl||[]).length};
  const p=sPrev;sPrev=sig;if(!p)return;const play=LZSound.play;
  if(G.ph==='lobby'){if(sig.n>p.n)play('join');return}
  if(G.ph==='gameEnd'&&p.ph!=='gameEnd'){play('fanfare');return}
  if(G.ph==='roundEnd'&&p.ph!=='roundEnd'){const w=G.res&&G.res.w;play(w==null?'lose':(me===null||w===me)?'win':'correct');return}
  if(sig.rd===p.rd&&sig.opened>p.opened){const t=G.tiles&&G.tiles[G.cur];play(t&&t.k==='a'?'magic':'pop');return}
  if(sig.msg!==p.msg&&G.msg&&(G.msg.k==='wrong'||G.msg.k==='no')){play('wrong');return}
  if(G.ph==='pick'&&me!==null&&me>=0&&sig.cur===me&&p.cur!==me)play('turn');
}
// Screenreader-Ansagen aus Zustandswechseln (läuft nach dem Rendern)
let aPrev=null;
function speak(G,me){
  if(!window.LZCozy||!G){aPrev=null;return}
  const cur=G.order?G.order[G.tp]:-1;
  const sig={ph:G.ph,opened:G.opened||0,rd:G.rd||0,msg:G.msg?JSON.stringify(G.msg):'',cur,n:(G.pl||[]).length};
  const p=aPrev||{ph:'',rd:-1,opened:0,msg:'',cur:-2,n:sig.n};aPrev=sig;   // erster Zustand: Runde & Zug ansagen
  const nm=i=>nameOf(G,i),out=[];let urgent=false;
  if(G.ph==='lobby'){if(sig.n>p.n)LZCozy.announce(nm(sig.n-1)+' ist beigetreten. '+sig.n+' im Warteraum.');return}
  if(G.ph==='gameEnd'&&p.ph!=='gameEnd'){
    const order=G.pl.map((x,i)=>({i,pts:x.pts})).sort((a,b)=>b.pts-a.pts),top=order.filter(o=>o.pts===order[0].pts);
    LZCozy.announce('Spielende. '+(top.length>1?'Gleichstand! ':nm(top[0].i)+' gewinnt! ')+order.map(o=>nm(o.i)+' '+o.pts+' Punkte').join(', '),{assertive:true});return}
  if(G.ph==='roundEnd'&&p.ph!=='roundEnd'){const r=G.res||{gains:[]};
    LZCozy.announce('Aufgelöst: '+G.card.answer+'. '+(r.w!=null?nm(r.w)+' hat es erraten. ':'Niemand ist draufgekommen. ')+r.gains.map(g=>nm(g.i)+' plus '+g.pts).join(', '),{assertive:true});return}
  if(sig.rd!==p.rd)out.push('Runde '+G.rd+'. Ich bin '+(CAT[G.card&&G.card.category]||'gesucht.'));
  if(sig.rd===p.rd&&sig.opened>p.opened&&G.cur!=null){const t=G.tiles[G.cur];out.push((t.k==='a'?'Sonderfeld ':'Hinweis ')+t.num+': '+t.t)}
  if(sig.msg!==p.msg&&G.msg)out.push(LZCozy.text(msgText(G,G.msg)));
  if(G.ph==='pick'&&(sig.cur!==p.cur||sig.rd!==p.rd)){
    if(me===null)out.push(nm(cur)+' ist dran.');
    else if(me===cur){out.push('Du bist dran. Wähl eine Zahl von 1 bis 20.');urgent=true}
    else out.push(nm(cur)+' ist dran.')}
  if(G.ph==='guess'&&p.ph!=='guess'&&(me===null||me===cur)&&G.mode==='typed')out.push('Deine Antwort?');
  if(out.length)LZCozy.announce(out.join(' '),{assertive:urgent});
}
let forced=false;
function render(force){
  if(force)forced=true;
  let main='',side='',G=null,me=null,ctl=false;
  if(V.view==='menu')main=viewMenu();
  else if(V.view==='local-setup')main=viewLocalSetup();
  else if(V.view==='lobby')main=viewLobby();
  else if(V.view==='local'){G=V.local;me=null;ctl=true}
  else if(V.view==='online'){
    readHost();G=ON.g;me=myIndex(G);ctl=ON.host;
    if(G&&G.pl)resolveNames(G.pl.map(p=>p.b));
    if(ON.hostGone&&!ON.host)main=`<div class="panel sheet"><h2>Die Spielleitung ist weg</h2><p>Es ist niemand mehr da, der das Spiel übernehmen kann.</p><div class="row"><button class="btn" type="button" data-do="leave">Zurück zur Spielsuche</button></div></div>`;
    else if(!G)main=`<div class="panel sheet"><h2>Verbinde …</h2><p>Einen Moment.</p><div class="row"><button class="btn ghost" type="button" data-do="leave">Abbrechen</button></div></div>`;
    else if(G.ph==='lobby')main=viewWaiting(G,me);
  }
  if(G&&!main){
    if(['pick','guess','action'].includes(G.ph))main=viewBoard(G,me,ctl);
    else if(G.ph==='roundEnd')main=viewRoundEnd(G,me,ctl);
    else if(G.ph==='gameEnd')main=viewGameEnd(G,me,ctl);
  }
  sounds(G,me);
  side=viewSide(G,me);
  const nameKey=JSON.stringify(NET.names);
  const mk=main+'|'+nameKey;
  if(mk!==lastMain||forced){
    const ae=document.activeElement,keep=ae&&ae.id&&ae.tagName==='INPUT'?{id:ae.id,v:ae.value,s:ae.selectionStart}:null;
    const guessVal=$('guess')?$('guess').value:null;
    const rf=window.LZCozy?LZCozy.saveFocus($('main')):null;
    $('main').innerHTML=main;lastMain=mk;
    if(guessVal!=null&&$('guess'))$('guess').value=guessVal;
    if(keep&&$(keep.id)){const el=$(keep.id);el.value=keep.v;el.focus();try{el.setSelectionRange(keep.s,keep.s)}catch(e){}}
    else if($('guess'))$('guess').focus({preventScroll:true});
    else if(rf)rf('[data-pick],.btn:not(.ghost):not([disabled]),.choice:not([disabled])');
  }
  if(side!==lastSide||forced){$('side').innerHTML=side;lastSide=side}
  forced=false;
  speak(G,me);
}

// ================= Eingaben =================
function readNames(){document.querySelectorAll('[data-name]').forEach(el=>{V.setup.names[+el.dataset.name]=el.value})}
document.addEventListener('click',e=>{
  const seg=e.target.closest('[data-seg] button');
  if(seg&&!seg.disabled){const key=seg.parentElement.dataset.seg,v=key==='goal'?+seg.dataset.v:seg.dataset.v;
    if(V.view==='local-setup'){readNames();V.setup[key]=v;saveLocal();render(true)}
    else if(V.view==='online'&&ON.host&&ON.H&&ON.H.ph==='lobby'){ON.H[key]=v;V.setup[key]=v;saveLocal();ON.dirty=true;hostTick();render(true)}
    return}
  const pk=e.target.closest('[data-pick]');if(pk){send('pick',{i:+pk.dataset.pick});return}
  const b=e.target.closest('[data-do]');if(!b)return;const d=b.dataset.do;
  switch(d){
    case 'goOnline':V.view='lobby';loadCustom();render(true);break;
    case 'goLocal':loadCustom();V.view=V.local&&V.local.ph?'local':'local-setup';render(true);break;
    case 'menu':if(V.view==='local-setup')readNames();V.view='menu';saveLocal();render(true);break;
    case 'addName':readNames();if(V.setup.names.length<6)V.setup.names.push('');render(true);break;
    case 'rmName':readNames();V.setup.names.splice(+b.dataset.i,1);render(true);break;
    case 'startLocal':{readNames();const pl=V.setup.names.map((n,i)=>({name:(n||'').trim()||('Person '+(i+1))}));V.local=newGame(V.setup,pl);V.view='local';saveLocal();render(true);break}
    case 'newSetup':V.setup.names=V.local?V.local.pl.map(p=>p.name):V.setup.names;V.local=null;V.view='local-setup';saveLocal();render(true);break;
    case 'saveName':{const el=$('myName');if(el&&window.kbName){window.kbName.set(el.value);toast('Name gespeichert');render(true)}break}
    case 'create':{const el=$('myName');if(el&&window.kbName&&el.value.trim())window.kbName.set(el.value);onlineCreate();break}
    case 'join':{const el=$('myName');if(el&&window.kbName&&el.value.trim())window.kbName.set(el.value);onlineJoin(b.dataset.code);break}
    case 'leave':if(inOnlineGame())askConfirm('Spiel wirklich verlassen?',leaveText(),'Verlassen',onlineLeave);else onlineLeave();break;
    case 'toLobby':if(ON.host&&ON.H){ON.H={hp:ON.H.hp,ph:'lobby',goal:ON.H.goal,mode:ON.H.mode,diff:ON.H.diff,reader:ON.H.reader||'pc',pl:ON.H.pl.map(p=>({p:p.p,b:p.b}))};ON.dirty=true;hostTick();render(true)}break;
    case 'hostStart':if(ON.host&&ON.H&&ON.H.pl.length>=2){ON.H={...newGame(ON.H,ON.H.pl.map(p=>({p:p.p,b:p.b}))),hp:ON.H.hp};ON.dirty=true;hostTick();render(true)}break;
    case 'guess':{const el=$('guess');if(el&&el.value.trim()){send('guess',{g:el.value.trim()});el.value=''}break}
    case 'pass':send('pass');break;
    case 'right':send('judge',{ok:true});break;
    case 'wrong':send('judge',{ok:false});break;
    case 'cont':send('cont');break;
    case 'override':send('override');break;
    case 'skipTurn':hostOnly('skip');break;
    case 'next':if(V.view==='local')send('next');else hostOnly('next');break;
    case 'rematch':if(V.view==='local')send('rematch');else hostOnly('rematch');break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='guess'){e.preventDefault();const v=e.target.value.trim();if(v){send('guess',{g:v});e.target.value=''}}
  if(e.target.id==='myName'){e.preventDefault();if(window.kbName){window.kbName.set(e.target.value);toast('Name gespeichert');render(true)}}
});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.name!=null){V.setup.names[+e.target.dataset.name]=e.target.value;saveLocal()}});
// Tastenkürzel: Zahl = Feld wählen, Leertaste = zum Antwortfeld (Buzzer), Enter = Hauptaktion
if(window.LZCozy){let buf='',bt=0;
  LZCozy.keys(e=>{
    const ae=document.activeElement,onBtn=ae&&ae!==document.body&&ae.matches('button,a,[role=button]');
    if(/^[0-9]$/.test(e.key)){
      if(!document.querySelector('#main [data-pick]'))return;
      e.preventDefault();buf=(buf+e.key).replace(/^0+/,'');clearTimeout(bt);if(!buf)return;
      const pick=()=>{const n=+buf;buf='';const t=document.querySelector('#main [data-pick][aria-label="Feld '+n+'"]');if(t)t.click();else LZCozy.announce('Feld '+n+' gibt es nicht oder ist schon offen.')};
      if(buf.length>=2||+buf>=3)pick();else bt=setTimeout(pick,700);   // "1"/"2" könnten noch 10–20 werden
      return}
    if(e.key===' '&&!onBtn){const g=$('guess');if(g){e.preventDefault();g.focus();return}
      const t=document.querySelector('#main [data-pick]');if(t){e.preventDefault();t.focus()}return}
    if(e.key==='Enter'&&!onBtn){const b=document.querySelector('#main .btn:not(.ghost):not([disabled]),#main .choice:not([disabled])');if(b){e.preventDefault();b.click()}}
  });
}
// Lösung nur zeigen, solange gedrückt
document.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-hold]');if(h)h.parentElement.classList.add('on')});
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t,()=>document.querySelectorAll('[data-peek].on').forEach(x=>x.classList.remove('on')),true));
function inOnlineGame(){const G=ON.g;return V.view==='online'&&ON.gr&&G&&G.pl&&myIndex(G)>=0&&(G.ph!=='lobby'&&G.ph!=='gameEnd'||(ON.host&&G.ph==='lobby'&&G.pl.length>1))}
function askConfirm(title,text,yes,cb){
  let m=$('zwConfirm');if(!m){m=document.createElement('div');m.id='zwConfirm';document.body.appendChild(m)}
  m.innerHTML=`<div class="panel sheet" role="dialog" aria-modal="true" aria-labelledby="cfT" style="max-width:460px"><h2 id="cfT">${title}</h2><p>${text}</p><div class="row"><button class="btn" id="cfYes" type="button">${yes}</button><button class="btn ghost" id="cfNo" type="button">Bleiben</button></div></div>`;
  m.hidden=false;const close=()=>{m.hidden=true};$('cfNo').onclick=close;$('cfYes').onclick=()=>{close();cb()};m.onclick=e=>{if(e.target===m)close()};$('cfNo').focus();
}
function leaveText(){return ON.host?'Du leitest gerade das Spiel. Wenn du gehst, übernimmt automatisch jemand anderes die Leitung.':'Du verlässt die laufende Partie. Die anderen spielen ohne dich weiter.'}
$('btnMenu').onclick=()=>{const go=()=>{if(V.view==='online')onlineLeave();V.view='menu';render(true)};if(inOnlineGame())askConfirm('Spiel wirklich verlassen?',leaveText(),'Verlassen',go);else go()};
document.addEventListener('click',e=>{const a=e.target.closest('a[data-home]');if(!a||!inOnlineGame())return;e.preventDefault();askConfirm('Spiel wirklich verlassen?',leaveText(),'Verlassen',()=>{onlineLeave();location.href=a.href})});
window.addEventListener('beforeunload',e=>{if(inOnlineGame()){e.preventDefault();e.returnValue=''}});

// ================= Verbindung =================
setInterval(()=>{if(V.view==='online'){hostTick();render()}else if(V.view==='lobby')render()},200);
(async()=>{
  const c=window.claude;
  if(!c||typeof c.use!=='function'){NET.state='off';render(true);return}
  try{NET.user=await c.use('user')}catch(e){}
  try{const room=await c.use('room');if(room){NET.room=room;room.onPeers(()=>{},()=>{NET.room=null;$('netpill').hidden=true;if(V.view==='online'||V.view==='lobby'){ON.gr=null;V.view='menu'}render(true)})}}catch(e){}
  NET.state=NET.room?'on':'off';$('netpill').hidden=!NET.room;render(true);
})();
if(window.LZSound)LZSound.mountToggle($('muteBtn'));
window.addEventListener('kbauth',()=>render(true));
loadCustom();
render(true);
})();
</script>
</body>
</html>
