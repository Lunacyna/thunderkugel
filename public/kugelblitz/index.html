/* Layout: Lunacynas Nachtzimmer — links die mondbeschienene Kugelschale (Canvas), rechts Aufgabenkarte, Uhr, Joker und Spieler als gerahmte Bilder. Bewusst nur dunkel. */

  --neon:#F6E6FF;

  --soft:rgba(255,255,255,.06);
  --font-display:"Dancing Script","Brush Script MT",cursive;
  --font-num:"Quicksand","Nunito","Segoe UI",system-ui,sans-serif;

  color-scheme:dark;
}

  background-color:var(--table);
    min-height:100%;
  color:var(--on-table);
  font-family:var(--font-body);
  font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));

  user-select:none;-webkit-user-select:none;
}

h1{font-family:var(--font-display);font-weight:700;font-size:clamp(40px,6vw,58px);margin:0;line-height:1;color:var(--neon);text-shadow:0 0 6px var(--neon-glow),0 0 18px var(--neon-glow),0 0 40px rgba(var(--rgb-glow,199,125,255),.6)}
h1 small{display:block;font-family:var(--font-body);font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;text-shadow:none;margin-top:6px}
.btn{font-family:var(--font-body);font-weight:700;font-size:15px;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:var(--saffron);color:var(--btn-ink);box-shadow:0 4px 0 var(--saffron-deep),0 0 18px rgba(var(--rgb-moon,253,213,187),.35);transition:transform .08s,box-shadow .08s}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.jokers{display:flex;gap:6px}
.jk{width:26px;height:26px;border-radius:50%;background:var(--saffron);box-shadow:inset 0 -3px 0 var(--saffron-deep),0 0 10px rgba(var(--rgb-moon,253,213,187),.5);display:grid;place-items:center;font-family:var(--font-num);font-weight:700;font-size:13px;color:var(--btn-ink)}
.jk.used{background:rgba(255,255,255,.08);box-shadow:none;color:rgba(var(--rgb-lav,185,166,232),.4)}
.players{display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:2px solid transparent}
.pl.active{border-color:rgba(var(--rgb-glow,199,125,255),.7);background:rgba(var(--rgb-glow,199,125,255),.1);box-shadow:0 0 14px rgba(var(--rgb-glow,199,125,255),.25)}
.pl .dot{width:14px;height:14px;border-radius:4px}
.pl .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .pts{font-family:var(--font-num);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.pl .mini{display:flex;gap:3px}
.pl .mini b{width:10px;height:10px;border-radius:50%;background:var(--saffron);box-shadow:inset 0 -2px 0 var(--saffron-deep)}
.pl .mini b.used{background:rgba(255,255,255,.1);box-shadow:none}
.hint{font-size:13px;line-height:1.45;color:var(--ink-soft);margin:0}
.toast{position:absolute;left:50%;top:4%;transform:translateX(-50%);background:var(--neon);color:var(--btn-ink);box-shadow:0 0 20px rgba(var(--rgb-glow,199,125,255),.6);font-weight:700;padding:8px 14px;border-radius:999px;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
table.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.res td{padding:7px 4px;border-bottom:1px solid var(--line);font-weight:700}
table.res td:last-child{text-align:right}
table.res tr.win td{color:var(--ok)}
.big{font-family:var(--font-num);font-weight:700;font-size:46px;line-height:1;color:var(--neon);text-shadow:0 0 14px rgba(var(--rgb-glow,199,125,255),.5)}
.choices{display:grid;gap:10px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:2px solid var(--line);background:var(--soft);border-radius:16px;padding:12px 14px;cursor:pointer;font-family:var(--font-body);color:var(--ink)}
.choice b{font-family:var(--font-display);font-weight:700;font-size:28px;color:var(--neon)}
.choice span{font-size:13px;color:var(--ink-soft);line-height:1.35}
.choice:hover:not([disabled]){border-color:var(--neon-glow);box-shadow:0 0 18px rgba(var(--rgb-glow,199,125,255),.35)}
.choice[disabled]{opacity:.5;cursor:not-allowed}
.games{display:flex;flex-direction:column;gap:6px}
.game{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft);border:2px solid var(--line)}
.game .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.game .s{font-size:12.5px;color:var(--ink-soft);font-weight:700}
.btn.small{padding:7px 14px;font-size:13.5px;box-shadow:0 3px 0 var(--saffron-deep)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(var(--rgb-lav,185,166,232),.4)}
.btn.line:active{transform:translateY(1px)}
.empty{font-size:13.5px;color:var(--ink-soft);padding:12px;border:2px dashed var(--line);border-radius:12px;text-align:center}
.prog{display:flex;gap:3px}
.prog b{width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,.12)}
.prog b.on{background:var(--ok)}
.pl.off{opacity:.45}
.pl .sub{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.netpill{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:rgba(var(--rgb-lav,185,166,232),.16);color:var(--on-table)}
.netpill.ok::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#5BE38B;margin-right:6px}
#kbConfirm{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(var(--rgb-deep,8,6,30),.62);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.botrow{display:flex;gap:6px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.btn,.toast{transition:none}}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:
    radial-gradient(1.2px 1.2px at 12% 18%,rgba(var(--rgb-neon,246,230,255),.9),transparent 60%),
    radial-gradient(1px 1px at 34% 8%,rgba(var(--rgb-neon,246,230,255),.7),transparent 60%),
    radial-gradient(1.4px 1.4px at 58% 22%,rgba(var(--rgb-neon,246,230,255),.8),transparent 60%),
    radial-gradient(1px 1px at 76% 12%,rgba(var(--rgb-neon,246,230,255),.7),transparent 60%),
    radial-gradient(1.3px 1.3px at 90% 30%,rgba(var(--rgb-neon,246,230,255),.8),transparent 60%),
    radial-gradient(1px 1px at 22% 46%,rgba(var(--rgb-neon,246,230,255),.6),transparent 60%),
    radial-gradient(1.2px 1.2px at 48% 60%,rgba(var(--rgb-neon,246,230,255),.6),transparent 60%),
    radial-gradient(1px 1px at 68% 52%,rgba(var(--rgb-neon,246,230,255),.5),transparent 60%),
    radial-gradient(1px 1px at 8% 72%,rgba(var(--rgb-neon,246,230,255),.5),transparent 60%),
    radial-gradient(1.2px 1.2px at 86% 70%,rgba(var(--rgb-neon,246,230,255),.5),transparent 60%),
    radial-gradient(60vmax 50vmax at 92% -8%,rgba(var(--rgb-moon,253,213,187),.16),transparent 60%),
    radial-gradient(90vmax 50vmax at 50% 120%,rgba(var(--rgb-peach,242,167,168),.28),transparent 60%),
    linear-gradient(180deg,var(--c-night,#120F2E) 0%,var(--c-night-2,#1D1842) 55%,var(--c-dusk,#3B2E66) 88%,var(--c-horizon,#5E4373) 100%);}

<script>
// Verbindung zum Kugelblitz-Server (Cloudflare Durable Objects) per WebSocket.
// Stellt dieselbe Schnittstelle bereit, die das Spiel erwartet: window.claude.use("room"|"user").
(()=>{
  window.KB_SERVER=true;
  const rid=()=>Math.random().toString(36).slice(2,12).padEnd(10,'0');
  const peerId=rid();
  let uid=null;try{uid=localStorage.getItem('kb_uid')}catch(e){}
  if(!uid||!/^u_[a-z0-9]{10}$/.test(uid)){uid='u_'+rid();try{localStorage.setItem('kb_uid',uid)}catch(e){}}
  const ADJ=['Flinke','Schnelle','Wilde','Kluge','Mutige','Lustige','Wache','Freche','Coole','Starke','Fixe','Heitere'];
  const TIER=['Eule','Katze','Ente','Robbe','Maus','Biene','Kröte','Möwe','Ziege','Qualle','Hummel','Taube'];
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const newName=()=>pick(ADJ)+' '+pick(TIER);
  let myName=null;try{myName=localStorage.getItem('kb_name')}catch(e){}
  if(!myName||myName.length>30)myName=newName();
  const names={};names[uid]=myName;
  const verified=new Set();
  const auth={enabled:false,user:null};
  window.kbAuth=auth;
  const conns=new Set();
  const cleanName=s=>typeof s==='string'?s.replace(/[^\p{L}\p{N} ._-]/gu,'').slice(0,30):'';

  // Namen lernen: Twitch-bestätigte Namen (vom Server) haben Vorrang vor selbst gewählten
  function learn(by,vn,pr){if(!by)return;if(vn){names[by]=cleanName(vn);verified.add(by)}else if(!verified.has(by)&&pr&&pr.nm)names[by]=cleanName(pr.nm)}
  function conn(roomName){
    const peers=new Map();const listeners=new Set();const connL=new Set();
    let readyRes;const ready=new Promise(r=>readyRes=r);setTimeout(()=>readyRes(false),5000);
    let ws=null,open=false,closed=false,my={nm:myName},snap=null,sendTimer=null,notifyQ=false,retry=0;
    peers.set(peerId,{by:uid,pr:my,t:Date.now()});
    const snapshot=()=>{if(!snap)snap=Object.freeze([...peers.entries()].map(([peer,v])=>Object.freeze({peer,by:v.by,isMe:peer===peerId,sameTab:peer===peerId,kind:'viewer',guest:false,presence:Object.freeze(v.pr||{}),updatedAt:v.t})));return snap};
    const changed=()=>{snap=null;if(notifyQ)return;notifyQ=true;setTimeout(()=>{notifyQ=false;const p=snapshot();listeners.forEach(fn=>{try{fn({peers:p,joined:[],left:[],updated:[]})}catch(e){console.error(e)}})},0)};
    const flush=()=>{sendTimer=null;if(open&&ws&&ws.readyState===1){try{ws.send(JSON.stringify({t:'p',pr:my}))}catch(e){}}};
    const queueSend=()=>{if(!sendTimer)sendTimer=setTimeout(flush,30)};
    const setOpen=v=>{if(open===v)return;open=v;connL.forEach(fn=>{try{fn(v)}catch(e){}})};
    function connect(){
      if(closed)return;
      const proto=location.protocol==='https:'?'wss':'ws';
      ws=new WebSocket(`${proto}://${location.host}/ws?room=${encodeURIComponent(roomName)}&peer=${peerId}&by=${uid}`);
      ws.onopen=()=>{retry=0;setOpen(true);readyRes(true);flush()};
      ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
        if(m.t==='snap'&&Array.isArray(m.peers)){for(const k of [...peers.keys()])if(k!==peerId)peers.delete(k);
          for(const p of m.peers){if(p&&p.peer&&p.peer!==peerId){peers.set(p.peer,{by:p.by,pr:p.pr||{},t:Date.now()});learn(p.by,p.vn,p.pr)}}changed()}
        else if(m.t==='p'&&m.peer&&m.peer!==peerId){if(m.pr===null)peers.delete(m.peer);else{peers.set(m.peer,{by:m.by,pr:m.pr,t:Date.now()});learn(m.by,m.vn,m.pr)}changed()}};
      ws.onclose=()=>{setOpen(false);readyRes(false);if(closed)return;for(const k of [...peers.keys()])if(k!==peerId)peers.delete(k);changed();retry=Math.min(retry+1,6);setTimeout(connect,400*retry)};
      ws.onerror=()=>{};
    }
    connect();
    const api={
      name:roomName.replace(/^g-/,''),
      presence(patch){if(!patch||typeof patch!=='object')return Promise.resolve();const n={...my};for(const k in patch){if(patch[k]===null)delete n[k];else n[k]=patch[k]}n.nm=myName;my=n;peers.set(peerId,{by:uid,pr:my,t:Date.now()});changed();queueSend();return Promise.resolve()},
      peers:snapshot,
      onPeers(fn){listeners.add(fn);setTimeout(()=>{try{fn({peers:snapshot(),joined:snapshot(),left:[],updated:[]})}catch(e){}},0);return()=>listeners.delete(fn)},
      emit(){return Promise.resolve()},on(){return()=>{}},
      connected:()=>open,
      onConnection(fn){connL.add(fn);setTimeout(()=>fn(open),0);return()=>connL.delete(fn)},
      leave(){closed=true;conns.delete(api);try{ws&&ws.close()}catch(e){}return Promise.resolve()},
      _ready:ready,
      _rename(){my={...my,nm:myName};peers.set(peerId,{by:uid,pr:my,t:Date.now()});changed();queueSend()}
    };
    conns.add(api);
    return api;
  }


  const user=Object.freeze({
    profiles(ids){const o={};(Array.isArray(ids)?ids:[ids]).forEach(id=>{o[id]={id,name:names[id]||'',verified:verified.has(id),avatarUrl:'',color:'#888',email:null,isMe:id===uid,guest:false}});return Promise.resolve(o)},
    id:()=>Promise.resolve(uid),name:()=>Promise.resolve(myName),

    const lobby=conn(['lobby-zw','lobby-ne','lobby-ar'].includes(window.KB_LOBBY)?window.KB_LOBBY:'lobby');

    return lobby._ready.then(ok=>{if(!ok){lobby.leave();return null}return room});
  });
  window.claude={use:n=>n==='room'?roomP:Promise.resolve(n==='user'?user:null)};

<script id="lzsound">
// LZSound – kleines Sound-System für Lunacynas Spielezimmer
// - Alle Töne werden live per Web Audio erzeugt (keine Audiodateien nötig).
// - Der AudioContext entsteht erst nach der ersten Nutzer-Interaktion (Autoplay-Regeln der Browser).
// - Stummschalten gilt für alle Seiten und bleibt über Reloads erhalten (localStorage "lz_muted").
// Benutzung:  LZSound.play('correct')   LZSound.mountToggle(buttonElement)   LZSound.setMuted(true)
// 8-Bit:      LZSound.setVoice('chip') -> alle Töne als Rechteckwelle wie ein alter Soundchip; LZSound.playIfReady('blip') spielt nur, wenn Audio schon freigeschaltet ist
window.LZSound = window.LZSound || (() => {
  const KEY = 'lz_muted';
  let muted = false;
  try { muted = localStorage.getItem(KEY) === '1'; } catch (e) {}
  let ac = null, master = null, voice = 'soft';
  const subs = new Set();

  function unlock() {
    if (muted) return;
    try {
      if (!ac) {
        const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
        ac = new C(); master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
      }
      if (ac.state === 'suspended') ac.resume();
    } catch (e) {}
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(t => window.addEventListener(t, unlock, { capture: true, passive: true }));

  function tone(f, dur, o) {
    o = o || {}; if (!ac || muted) return;
    const t = ac.currentTime + (o.delay || 0), osc = ac.createOscillator(), g = ac.createGain();
    const chip = voice === 'chip' && o.type !== 'noise';
    osc.type = chip ? (o.type === 'sawtooth' ? 'sawtooth' : 'square') : (o.type || 'sine'); osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(f * o.slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime((o.vol || 0.15) * (chip ? 0.55 : 1), t + (chip ? 0.004 : 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(master); osc.start(t); osc.stop(t + dur + 0.02);
  }
  function noise(dur, o) {
    o = o || {}; if (!ac || muted) return;
    const t = ac.currentTime, buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) { const k = i / d.length; d[i] = (Math.random() * 2 - 1) * (1 - k) * (0.5 + 0.5 * Math.sin(k * (o.wobble || 60))); }
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'bandpass'; f.frequency.value = o.freq || 900; g.gain.value = o.vol || 0.4;
    s.buffer = buf; s.connect(f).connect(g).connect(master); s.start(t);
  }
  const notes = (list, o) => list.forEach((f, i) => tone(f, (o.len && o.len[i]) || o.dur || 0.16, { type: o.type || 'triangle', vol: o.vol || 0.16, delay: i * (o.step || 0.08) }));

  const SOUNDS = {
    click:   () => tone(520, 0.06, { type: 'triangle', vol: 0.08 }),
    pop:     () => tone(660, 0.12, { type: 'triangle', vol: 0.2, slide: 1.8 }),
    buzz:    () => { tone(150, 0.32, { type: 'square', vol: 0.07, slide: 0.8 }); tone(156, 0.32, { type: 'sawtooth', vol: 0.035, slide: 0.8 }); },
    wrong:   () => { tone(392, 0.14, { vol: 0.13, type: 'triangle' }); tone(311, 0.28, { vol: 0.13, type: 'triangle', delay: 0.13 }); },
    correct: () => notes([523, 659, 784], { step: 0.08 }),
    win:     () => notes([523, 659, 784, 1046], { step: 0.09, dur: 0.2 }),
    fanfare: () => notes([523, 659, 784, 1046, 784, 1046], { step: 0.12, len: [0.16, 0.16, 0.16, 0.25, 0.16, 0.55], vol: 0.17 }),
    lose:    () => notes([392, 349, 311], { step: 0.14, dur: 0.22, vol: 0.12 }),
    tick:    () => tone(880, 0.08, { vol: 0.11 }),
    go:      () => tone(1175, 0.25, { type: 'triangle', vol: 0.17 }),
    turn:    () => { tone(988, 0.1, { vol: 0.11 }); tone(1319, 0.2, { vol: 0.11, delay: 0.1 }); },
    magic:   () => notes([1319, 1568, 1760, 2093], { step: 0.06, dur: 0.14, type: 'sine', vol: 0.08 }),
    shake:   () => noise(0.7, { freq: 900, vol: 0.5, wobble: 90 }),
    join:    () => tone(784, 0.14, { type: 'sine', vol: 0.09, slide: 1.5 }),
    // 8-Bit / Retro
    blip:      () => tone(1760, 0.025, { type: 'square', vol: 0.035 }),
    select:    () => { tone(988, 0.045, { type: 'square', vol: 0.07 }); tone(1480, 0.07, { type: 'square', vol: 0.07, delay: 0.045 }); },
    klack:     () => { noise(0.045, { freq: 2600, vol: 0.55, wobble: 0 }); tone(130, 0.05, { type: 'square', vol: 0.09, slide: 0.6 }); },
    powerup:   () => notes([523, 659, 784, 1046, 1319], { step: 0.05, dur: 0.07, type: 'square', vol: 0.08 }),
    powerdown: () => notes([1046, 784, 523, 392], { step: 0.05, dur: 0.07, type: 'square', vol: 0.07 }),
    coin:      () => { tone(988, 0.08, { type: 'square', vol: 0.08 }); tone(1319, 0.38, { type: 'square', vol: 0.08, delay: 0.08 }); },
  };

  function play(name) { if (muted) return; unlock(); const f = SOUNDS[name]; if (f && ac) { try { f(); } catch (e) {} } }
  // für Hover-Töne: nie selbst einen AudioContext anlegen (Autoplay-Regeln), nur spielen, wenn er schon läuft
  function playIfReady(name) { if (muted || !ac || ac.state !== 'running') return; const f = SOUNDS[name]; if (f) { try { f(); } catch (e) {} } }
  function setVoice(v) { voice = v === 'chip' ? 'chip' : 'soft'; }
  function emit() { subs.forEach(fn => { try { fn(muted); } catch (e) {} }); }
  function setMuted(m) {
    muted = !!m;
    try { localStorage.setItem(KEY, muted ? '1' : '0'); } catch (e) {}
    if (master && ac) master.gain.setTargetAtTime(muted ? 0 : 0.9, ac.currentTime, 0.01);
    emit(); if (!muted) { unlock(); play('click'); }
  }
  window.addEventListener('storage', e => { if (e.key === KEY) { muted = e.newValue === '1'; if (master && ac) master.gain.value = muted ? 0 : 0.9; emit(); } });

  const ON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  const OFF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  (function css() {
    const st = document.createElement('style');
    st.textContent = '.lz-mute{width:44px;height:44px;flex:none;border-radius:50%;border:0;cursor:pointer;display:inline-grid;place-items:center;background:transparent;color:var(--c-text,#EFE9FF);box-shadow:inset 0 0 0 2px rgba(var(--rgb-lav,185,166,232),.45);transition:box-shadow .15s}'
      + '.lz-mute:hover{box-shadow:inset 0 0 0 2px var(--c-neon,#F6E6FF),0 0 16px rgba(var(--rgb-glow,199,125,255),.45)}'
      + '.lz-mute:focus-visible{outline:3px solid var(--c-neon,#F6E6FF);outline-offset:3px}'
      + '.lz-mute svg{width:22px;height:22px}'
      + '.lz-mute[aria-pressed="true"]{color:var(--c-peach,#F2A7A8);box-shadow:inset 0 0 0 2px rgba(var(--rgb-peach,242,167,168),.6)}';
    (document.head || document.documentElement).appendChild(st);
  })();
  function mountToggle(btn) {
    if (!btn) return;
    btn.classList.add('lz-mute'); btn.type = 'button';
    const upd = m => { btn.setAttribute('aria-pressed', String(m)); const t = m ? 'Ton einschalten' : 'Ton ausschalten'; btn.title = t; btn.setAttribute('aria-label', t); btn.innerHTML = m ? OFF : ON; };
    upd(muted); subs.add(upd);
    btn.addEventListener('click', () => setMuted(!muted));
  }
  return { play, playIfReady, setVoice, voice: () => voice, unlock, setMuted, isMuted: () => muted, mountToggle, onChange: fn => subs.add(fn), sounds: Object.keys(SOUNDS) };
})();
</script>
<script>
(()=>{
// ================= Konstanten =================
const W=640, CX=320, CY=320, R=272, RIM=22, BR=18, NB=36;
const COLORS=[
  {n:'Rot',c:'#E5392C',d:'#A61F15'},{n:'Gelb',c:'#FFCB1F',d:'#C99300'},
  {n:'Blau',c:'#2F7DF6',d:'#1546A8'},{n:'Grün',c:'#2DB04B',d:'#18752E'},
  {n:'Orange',c:'#FF8A1F',d:'#C25500'},{n:'Lila',c:'#9447D1',d:'#5E2391'}
];
const isKamin=()=>document.documentElement.getAttribute('data-theme')==='kamin';
const PCOL=['#E5392C','#2DB04B','#9447D1','#FF8A1F'];
const MODES={farben:'Farben',zahlen:'Zahlen',rechnen:'Rechnen'};
const K=1.6, DAMP=1.4, REST=.55, PEN=2, HOLD=0.9, BLOCK_N=5;
const cv=document.getElementById('bowl'), ctx=cv.getContext('2d');
// 8-Bit-Modus: Schale in grober Auflösung zeichnen, CSS skaliert pixelig hoch (image-rendering:pixelated)
const isRetro=()=>document.documentElement.classList.contains('retro-mode');
function retroRes(){const n=isRetro()?360:1280;if(cv.width!==n){cv.width=cv.height=n}ctx.imageSmoothingEnabled=!isRetro()}
retroRes();addEventListener('lzretro',retroRes);
const $=id=>document.getElementById(id);
const overlay=$('overlay');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>(+v||0).toFixed(1).replace('.',',');
const RM=matchMedia('(prefers-reduced-motion: reduce)');

// ================= Zufall =================
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ================= Sound (über LZSound, mit globalem Stummschalter) =================
function audio(){if(window.LZSound)LZSound.unlock()}
const snd=n=>{if(window.LZSound)LZSound.play(n)};
const sfx={pop:()=>snd('pop'),bad:()=>snd('buzz'),tick:()=>snd('tick'),go:()=>snd('go'),win:()=>snd('win'),fanfare:()=>snd('fanfare'),lose:()=>snd('lose'),shake:()=>snd('shake'),join:()=>snd('join')};

// ================= Physik =================
const SHAKE={t:0,dir:0};   // wirkt auf die Simulation
const WOB={t:0,dir:0};     // nur Optik
function makeBalls(seed){
  const r=rng(seed), balls=[];
  const nums=shuffle([1,2,3,4,5,6,7,8,9,1,2,3,4,5,6,7,8,9,1,2,3,4,5,6,7,8,9,1,2,3,4,5,6,7,8,9],r);
  let k=0;
  for(let c=0;c<6;c++)for(let i=0;i<6;i++){
    let x,y,tries=0;
    do{const a=r()*Math.PI*2,d=Math.sqrt(r())*(R-BR-10);x=CX+Math.cos(a)*d;y=CY+Math.sin(a)*d;tries++}
    while(tries<400&&balls.some(b=>(b.x-x)**2+(b.y-y)**2<(2*BR+1)**2));
    balls.push({id:k,x,y,vx:0,vy:0,color:c,num:nums[k],blocked:false,rot:r()*6.28});k++;
  }
  const saved={t:SHAKE.t};SHAKE.t=0;
  for(let i=0;i<720;i++)physics(1/120,balls);
  SHAKE.t=saved.t;
  for(const b of balls){b.vx=0;b.vy=0}
  return balls;
}
function physics(dt,balls){
  const n=balls.length;let sx=0,sy=0;
  if(SHAKE.t>0){const a=Math.sin((0.7-SHAKE.t)*Math.PI*2*7)*2600;sx=Math.cos(SHAKE.dir)*a;sy=Math.sin(SHAKE.dir)*a}
  for(const b of balls){
    b.vx+=(-K*(b.x-CX)+sx)*dt;b.vy+=(-K*(b.y-CY)+sy)*dt;
    const f=Math.exp(-DAMP*dt);b.vx*=f;b.vy*=f;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=(b.vx+b.vy)*dt*.02;
  }
  for(let it=0;it<2;it++){
    for(let i=0;i<n;i++){const a=balls[i];
      for(let j=i+1;j<n;j++){const b=balls[j];const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,m=2*BR;
        if(d2<m*m&&d2>1e-6){const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,o=(m-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
          const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(vn<0){const imp=-(1+REST)*vn/2;a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny}}}}
    for(const b of balls){const dx=b.x-CX,dy=b.y-CY,d=Math.hypot(dx,dy),lim=R-BR;
      if(d>lim){const nx=dx/d,ny=dy/d;b.x=CX+nx*lim;b.y=CY+ny*lim;const vn=b.vx*nx+b.vy*ny;if(vn>0){b.vx-=(1+REST)*vn*nx;b.vy-=(1+REST)*vn*ny}}}
  }
}
function stepSim(dt,balls){SHAKE.acc=(SHAKE.acc||0)+dt;while(SHAKE.acc>=1/120){physics(1/120,balls);if(SHAKE.t>0)SHAKE.t=Math.max(0,SHAKE.t-1/120);SHAKE.acc-=1/120}}
function computeBlocked(balls){const L=(2*BR+4)**2;for(const a of balls){let c=0;for(const b of balls){if(a!==b&&(a.x-b.x)**2+(a.y-b.y)**2<L)c++}a.blocked=c>=BLOCK_N}}
function kick(balls){const dir=Math.random()*Math.PI*2;SHAKE.t=.7;SHAKE.dir=dir;for(const b of balls){const a=Math.random()*Math.PI*2,s=180+Math.random()*320;b.vx+=Math.cos(a)*s;b.vy+=Math.sin(a)*s}return dir}

// ================= Karten =================
// Mehrere Karten aus einem Seed – zusammen nie mehr Kugeln verlangt, als in der Schale liegen.
function makeCards(seed,n,mode){
  const r=rng(seed*7+3), cards=[], cc=[0,0,0,0,0,0], nc=Array(10).fill(0);
  for(let p=0;p<n;p++){const card=[];
    while(card.length<5){
      if(mode==='farben'){const c=ri(r,0,5);if(cc[c]<6){cc[c]++;card.push({color:c})}}
      else{const v=ri(r,1,9);if(nc[v]>=4)continue;nc[v]++;
        if(mode==='zahlen')card.push({num:v});
        else{let txt;if(v>=2&&r()<.55){const a=ri(r,1,v-1);txt=a+'+'+(v-a)}else{const b=ri(r,1,Math.min(6,10-v));txt=(v+b)+'−'+b}card.push({num:v,txt})}}
    }cards.push(card)}
  return cards;
}
const matches=(mode,b,t)=>!!t&&(mode==='farben'?b.color===t.color:b.num===t.num);

// ================= Zeichnen =================
function drawBall(b,x,y,s=1,alpha=1){
  const C=COLORS[b.color];ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.scale(s,s);
  const g=ctx.createRadialGradient(-6,-7,2,0,0,BR);g.addColorStop(0,'#ffffff');g.addColorStop(.16,C.c);g.addColorStop(.75,C.c);g.addColorStop(1,C.d);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,BR,0,Math.PI*2);ctx.fill();
  const ox=Math.cos(b.rot)*3,oy=Math.sin(b.rot)*3;
  ctx.fillStyle='rgba(255,255,255,.95)';ctx.beginPath();ctx.arc(ox+1,oy+2,8.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#14214F';ctx.font='700 12px Quicksand, system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.num,ox+1,oy+2.5);
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(-7,-8,5,3,-.6,0,Math.PI*2);ctx.fill();ctx.restore();
}
const mouse={x:-999,y:-999,in:false,down:false};
const onRim=(x,y)=>{const d=Math.hypot(x-CX,y-CY);return d>R-4&&d<R+RIM+10};
function ballAt(balls,x,y){let best=null,bd=(BR+5)**2;for(const b of balls){const d=(b.x-x)**2+(b.y-y)**2;if(d<bd){bd=d;best=b}}return best}
const FX={flashes:[],flyers:[]};
// V: {balls, interactive, jokers, countdown, hold, locked, others:[{x,y,col}]}
function draw(V){
  const s=cv.width/W;ctx.setTransform(s,0,0,s,0,0);ctx.clearRect(0,0,W,W);
  let wx=0,wy=0;

function askConfirm(title,text,yes,cb){
  let m=document.getElementById('kbConfirm');if(!m){m=document.createElement('div');m.id='kbConfirm';document.body.appendChild(m)}
  m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cfT"><h2 id="cfT">${title}</h2><p>${text}</p><div class="row"><button class="btn" id="cfYes" type="button">${yes}</button><button class="btn line" id="cfNo" type="button">Bleiben</button></div></div>`;
  m.hidden=false;const close=()=>{m.hidden=true};
  document.getElementById('cfNo').onclick=close;document.getElementById('cfYes').onclick=()=>{close();cb()};
  m.onclick=e=>{if(e.target===m)close()};document.getElementById('cfNo').focus();
}
function myPeer(){if(ON&&ON.solo)return 'solo';const r=NET.room;if(!r)return null;const m=r.peers().find(p=>p.sameTab);return m?m.peer:null}
function resolveNames(ids){
  const u=NET.user;if(!u)return;const need=ids.filter(id=>id&&!NET.asked.has(id));if(!need.length)return;
  need.forEach(id=>NET.asked.add(id));setTimeout(()=>need.forEach(id=>{if(!NET.names[id])NET.asked.delete(id)}),1500);
  u.profiles(need).then(ps=>{for(const id of need){const p=ps&&ps[id];NET.names[id]=(p&&p.name)||''}ON.okey='';sideKey=''}).catch(()=>{});
}
const nameOf=(by,i)=>(by&&NET.names[by])||('Spieler '+(i+1));
const pname=(p,i)=>p&&p.nm?p.nm:nameOf(p&&p.b,i);
const isInt=v=>Number.isInteger(v);

const ON={
  view:'lobby', gr:null, code:null, host:false, solo:false, joinedAt:0, okey:'', gonePeerAt:0,
  // Client-Zustand
  g:null, spec:null, specSeed:null, cards:null, rpos:{}, pending:null, picks:0, shakes:0, hold:null,
  lastSk:0, lastSt:-1, lastCd:0, lastPh:'', hostSeenAt:0, hostGone:false,
  // Host-Zustand
  H:null,

  lobby(){
    if(this.gr)this.leave(true);
    APP='online';this.view='lobby';this.okey='';cv.classList.remove('playing');
  },
  async create(){
    const code='kb-'+Math.random().toString(36).slice(2,6).padEnd(4,'x');
    try{this.gr=await NET.room.join(code)}catch(e){toast('Spiel konnte nicht eröffnet werden');return}
    this.code=code;this.host=true;this.view='game';this.joinedAt=performance.now();this.reset();
    this.H={g:{v:1,ph:'lobby',mode:'farben',rounds:5,rd:0,seed:0,pl:[],rm:[],el:0,cd:0,sk:0,sd:0,win:-1,hp:myPeer()},balls:[],cards:[],seenPk:{},seenSh:{},lock:{},lastPub:0,t0:0,cdEnd:0,bots:{}};
    this.gr.presence({j:1}).catch(()=>{});
    this.watch();
  },
  createSolo(){
    if(this.gr)this.leave(true);
    APP='online';this.solo=true;this.gr=localRoom();this.code='solo';this.host=true;this.view='game';this.joinedAt=performance.now();this.reset();
    this.H={g:{v:1,ph:'lobby',mode:'farben',rounds:5,rd:0,seed:0,pl:[],rm:[],el:0,cd:0,sk:0,sd:0,win:-1,hp:'solo'},balls:[],cards:[],seenPk:{},seenSh:{},lock:{},lastPub:0,t0:0,cdEnd:0,bots:{}};
    this.gr.presence({j:1});this.hostSyncLobbyPlayers();this.addBot(2);
  },
  addBot(lv){
    const g=this.H&&this.H.g;if(!g||g.ph!=='lobby'||g.pl.length>=4)return;
    const used=new Set(g.pl.map(p=>p.nm));const nm=(BOTNAMES.find(n=>!used.has(n+' (Bot)'))||'Bot')+' (Bot)';
    g.pl.push({p:'bot-'+Math.random().toString(36).slice(2,8),b:null,nm,bot:1,lv,pts:0,jk:3,st:0,lk:0});this.okey='x';
  },
  removeBot(peer){const g=this.H&&this.H.g;if(!g||g.ph!=='lobby')return;g.pl=g.pl.filter(p=>p.p!==peer);this.okey='x'},
  inGame(){const g=this.g;if(!this.gr||!g)return false;if(this.solo)return g.ph!=='lobby'&&g.ph!=='over';
    if(this.myIndex()<0)return false;return g.ph!=='lobby'&&g.ph!=='over'||(this.host&&g.ph==='lobby'&&g.pl.filter(p=>!p.bot).length>1)},
  botTick(dt,now){
    const H=this.H,g=H.g;
    g.pl.forEach((p,i)=>{
      if(!p.bot)return;const L=BOTLV[p.lv]||BOTLV[2];
      let st=H.bots[p.p];if(!st)st=H.bots[p.p]={x:CX+rnd(-120,120),y:CY+R-50,tgt:null,until:now+rnd(...L.react),hold:0,stuck:0,wrong:false};
      p.cx=Math.round(st.x);p.cy=Math.round(st.y);
      if(g.ph!=='play'){st.tgt=null;st.until=now+rnd(...L.react);return}
      if((H.lock[p.p]||0)>now){st.tgt=null;st.until=Math.max(st.until,(H.lock[p.p]||0)+rnd(...L.react)*.5);return}
      if(now<st.until)return;
      const card=H.cards[i]&&H.cards[i][p.st];if(!card)return;
      let b=st.tgt!=null?H.balls.find(x=>x.id===st.tgt):null;
      if(b&&!st.wrong&&!matches(g.mode,b,card))b=null;
      if(!b){
        const cands=H.balls.filter(x=>matches(g.mode,x,card));if(!cands.length)return;
        const free=cands.filter(x=>!x.blocked);
        if(!free.length){st.stuck+=dt;if(st.stuck>L.stuck&&p.jk>0&&SHAKE.t<=0){this.hostShake(p.p);st.stuck=0;st.until=now+500;return}}else st.stuck=0;
        let pool=free.length?free:cands;st.wrong=false;
        if(Math.random()<L.miss){const wr=H.balls.filter(x=>!matches(g.mode,x,card));if(wr.length){pool=wr;st.wrong=true}}
        pool=pool.slice().sort((a,c)=>Math.hypot(a.x-st.x,a.y-st.y)-Math.hypot(c.x-st.x,c.y-st.y));
        b=pool[Math.random()<.7?0:Math.min(pool.length-1,1)];st.tgt=b.id;st.hold=0;
      }
      const dx=b.x-st.x,dy=b.y-st.y,d=Math.hypot(dx,dy),step=L.speed*dt;
      if(d>5){const k=Math.min(step,d)/d;st.x+=dx*k;st.y+=dy*k}
      else{
        if(b.blocked&&!st.wrong){st.hold+=dt;if(st.hold<HOLD+.05){p.cx=Math.round(st.x);p.cy=Math.round(st.y);return}}
        this.hostPick(p.p,b.id);st.tgt=null;st.wrong=false;st.until=now+rnd(...L.react);
      }
      p.cx=Math.round(st.x);p.cy=Math.round(st.y);
    });
  },
  takeOver(g0){
    const now=performance.now(),g=JSON.parse(JSON.stringify(g0));g.hp=myPeer();
    const H={g,balls:[],cards:[],seenPk:{},seenSh:{},lock:{},lastPub:0,t0:now-(+g.el||0)*1000,cdEnd:now+(+g.cd||1)*800,bots:{}};
    if(g.seed){const rm=new Set(g.rm||[]);H.balls=makeBalls(g.seed).filter(b=>!rm.has(b.id)).map(b=>{if(Array.isArray(g.pos)&&g.pos[b.id*2]){b.x=+g.pos[b.id*2];b.y=+g.pos[b.id*2+1]}return b});
      H.cards=makeCards(g.seed,g.pl.length,g.mode)}
    for(const p of this.gr.peers()){const pr=p.presence||{};if(Array.isArray(pr.pk)&&isInt(pr.pk[0]))H.seenPk[p.peer]=pr.pk[0];if(isInt(pr.sh))H.seenSh[p.peer]=pr.sh}
    this.H=H;this.host=true;this.hostGone=false;this.okey='';toast('Die Spielleitung ist weg – du leitest jetzt das Spiel');
  },
  async join(code){
    if(!/^kb-[a-z0-9]{4}$/.test(code))return;
    try{this.gr=await NET.room.join(code)}catch(e){toast('Beitreten hat nicht geklappt');return}
    this.code=code;this.host=false;this.view='game';this.joinedAt=performance.now();this.reset();
    this.gr.presence({j:1}).catch(()=>{});
    this.watch();
  },
  watch(){
    const gr=this.gr;
    gr.onPeers(()=>{},()=>{if(this.gr===gr){toast('Verbindung zum Spiel verloren');this.leave();}});
  },
  reset(){this.gonePeerAt=0;this.g=null;this.spec=null;this.specSeed=null;this.cards=null;this.rpos={};this.pending=null;this.hold=null;this.lastSk=null;this.lastSt=-1;this.lastCd=0;this.lastPh='';this.hostSeenAt=performance.now();this.hostGone=false;this.okey=''},
  leave(silent){
    if(this.gr){try{this.gr.leave()}catch(e){}}
    if(this.host&&NET.room&&!this.solo)NET.room.presence({host:null}).catch(()=>{});
    if(this.solo&&!silent){this.solo=false;this.gr=null;this.host=false;this.H=null;showMenu();return}
    this.solo=false;this.gr=null;this.host=false;this.H=null;this.code=null;this.view='lobby';this.okey='';cv.classList.remove('playing');
  },

  // ---------- Host ----------
  hostSyncLobbyPlayers(){
    const H=this.H,g=H.g,peers=this.gr.peers(),me=myPeer();
    const present=new Map(peers.filter(p=>p.kind==='viewer'&&p.presence&&p.presence.j===1).map(p=>[p.peer,p]));
    const bots=g.pl.filter(x=>x.bot);
    let pl=g.pl.filter(x=>!x.bot&&present.has(x.p));
    if(me&&!pl.some(x=>x.p===me))pl.unshift({p:me,b:(present.get(me)||{}).by||null});
    for(const [peer,p] of present){if(pl.length>=4)break;if(!pl.some(x=>x.p===peer))pl.push({p:peer,b:p.by||null})}
    pl=pl.concat(bots).slice(0,4);
    g.pl=pl.map(x=>({p:x.p,b:x.b||null,nm:x.bot?x.nm:(this.solo&&x.p===me?'Du':undefined),bot:x.bot,lv:x.lv,pts:0,jk:3,st:0,lk:0}));
  },
  hostStartGame(){const g=this.H.g;if(g.pl.length<2)return;g.gs=statId();g.pl.forEach(p=>{p.pts=0;p.jk=3});g.rd=0;this.hostNextRound()},
  hostNextRound(){
    const H=this.H,g=H.g;
    if(g.rd>=g.rounds){g.ph='over';
      const humans=g.pl.filter(p=>!p.bot);
      if(!this.solo&&humans.length>=2){const max=Math.max(...g.pl.map(p=>p.pts));reportScores('kb',g.pl.map((p,k)=>({p,k})).filter(o=>!o.p.bot).map(o=>({name:pname(o.p,o.k),b:o.p.b||'',pts:o.p.pts,win:o.p.pts===max})))}
      return}
    H.bots={};H.shk=0;
    g.rd++;g.seed=(Math.random()*1e9)|0;H.balls=makeBalls(g.seed);H.cards=makeCards(g.seed,g.pl.length,g.mode);
    g.rm=[];g.win=-1;g.el=0;g.pl.forEach(p=>{p.st=0;p.lk=0});H.lock={};
    // alte Absichten nicht erneut ausführen
    for(const p of this.gr.peers()){const pr=p.presence||{};if(Array.isArray(pr.pk)&&isInt(pr.pk[0]))H.seenPk[p.peer]=pr.pk[0];if(isInt(pr.sh))H.seenSh[p.peer]=pr.sh}
    g.ph='count';H.cdEnd=performance.now()+2400;
  },
  hostPick(peer,id){
    const H=this.H,g=H.g;if(g.ph!=='play')return;
    const i=g.pl.findIndex(p=>p.p===peer);if(i<0)return;const pl=g.pl[i],now=performance.now();
    if((H.lock[peer]||0)>now)return;
    const bi=H.balls.findIndex(b=>b.id===id);if(bi<0)return;const b=H.balls[bi];
    if(!matches(g.mode,b,H.cards[i][pl.st])){H.lock[peer]=now+PEN*1000;return}
    H.balls.splice(bi,1);g.rm.push(id);pl.st++;
    if(pl.st>=5){g.ph='round';g.win=i;pl.pts++;g.el=Math.round((now-H.t0)/100)/10;
      if(g.gs&&H.t0)statRound(g.gs,g.rd,g.el,g.pl.filter(x=>!x.bot).reduce((a,x)=>a+(x.st|0),0),H.shk||0)}
  },
  hostShake(peer){
    const H=this.H,g=H.g;if(g.ph!=='play'||SHAKE.t>0)return;
    const pl=g.pl.find(p=>p.p===peer);if(!pl||pl.jk<=0)return;
    pl.jk--;if(!pl.bot)H.shk=(H.shk||0)+1;g.sd=Math.round(kick(H.balls)*100)/100;g.sk++;g.sb=g.pl.indexOf(pl);
  },
  hostTick(dt,now){
    const H=this.H,g=H.g;
    const me=myPeer();if(me)g.hp=me;
    if(!this.solo){const other=this.gr.peers().find(p=>!p.sameTab&&p.presence&&p.presence.g&&typeof p.presence.g==='object');
      if(other&&me&&other.peer<me){this.host=false;this.H=null;this.gr.presence({g:null}).catch(()=>{});return}}
    if(g.ph==='lobby')this.hostSyncLobbyPlayers();
    this.botTick(dt,now);
    // Absichten der Mitspieler einsammeln
    for(const p of this.gr.peers()){
      if(p.sameTab)continue;const pr=p.presence||{};
      if(Array.isArray(pr.pk)&&isInt(pr.pk[0])&&isInt(pr.pk[1])&&pr.pk[0]>(H.seenPk[p.peer]||0)){H.seenPk[p.peer]=pr.pk[0];this.hostPick(p.peer,pr.pk[1])}
      if(isInt(pr.sh)&&pr.sh>(H.seenSh[p.peer]||0)){H.seenSh[p.peer]=pr.sh;this.hostShake(p.peer)}
    }
    if(g.ph==='count'){g.cd=Math.max(1,Math.ceil((H.cdEnd-now)/800));if(now>=H.cdEnd){g.ph='play';g.cd=0;H.t0=now}}
    if(g.ph==='play'){g.el=Math.round((now-H.t0)/100)/10}
    if(H.balls.length)stepSim(dt,H.balls);
    g.pl.forEach(p=>{p.lk=Math.max(0,Math.round(((H.lock[p.p]||0)-now)/100)/10)});
    if(now-H.lastPub>50){
      H.lastPub=now;
      const pos=new Array(NB*2).fill(0);for(const b of H.balls){pos[b.id*2]=Math.round(b.x);pos[b.id*2+1]=Math.round(b.y)}
      g.pos=pos;
      this.gr.presence({g:g}).catch(()=>{});
      if(NET.room&&!this.solo)NET.room.presence({host:{code:this.code,mode:g.mode,rounds:g.rounds,n:g.pl.length,ph:g.ph}}).catch(()=>{});
    }
  },

  // ---------- gemeinsamer Client ----------
  readHost(now){
    if(this.host){this.g=this.H.g;this.hostSeenAt=now;return}
    const peers=this.gr.peers(),here=new Set(peers.map(p=>p.peer));
    const hp=peers.find(p=>p.presence&&p.presence.g&&typeof p.presence.g==='object');
    if(hp){this.g=hp.presence.g;this.hostPeer=hp.peer;this.hostSeenAt=now;this.hostGone=false;this.gonePeerAt=0;return}
    if(!this.gonePeerAt)this.gonePeerAt=now;
    const g=this.g;
    if(g&&Array.isArray(g.pl)&&now-this.gonePeerAt>2500){
      const next=g.pl.find(p=>!p.bot&&p.p!==g.hp&&here.has(p.p));
      if(next&&next.p===myPeer()){this.takeOver(g);return}
    }
    if(now-this.hostSeenAt>12000)this.hostGone=true;
  },
  myIndex(){const g=this.g,me=myPeer();if(!g||!Array.isArray(g.pl)||!me)return -1;return g.pl.findIndex(p=>p&&p.p===me)},
  clientBalls(){
    const g=this.g;if(!g||!isInt(g.seed)||!g.seed)return idleBalls;
    if(this.specSeed!==g.seed){this.spec=makeBalls(g.seed);this.specSeed=g.seed;this.rpos={};this.cards=makeCards(g.seed,(g.pl||[]).length,g.mode)}
    if(this.host)return this.H.balls;
    const rm=new Set(Array.isArray(g.rm)?g.rm:[]),out=[],pos=Array.isArray(g.pos)?g.pos:null;
    for(const s of this.spec){
      if(rm.has(s.id))continue;if(this.pending&&this.pending.id===s.id)continue;
      let r=this.rpos[s.id];const tx=pos?+pos[s.id*2]:s.x,ty=pos?+pos[s.id*2+1]:s.y;
      if(!r){r=this.rpos[s.id]={id:s.id,x:tx||s.x,y:ty||s.y,color:s.color,num:s.num,rot:s.rot}}
      if(tx||ty){const nx=r.x+(tx-r.x)*.35,ny=r.y+(ty-r.y)*.35;r.rot+=((nx-r.x)+(ny-r.y))*.02;r.x=nx;r.y=ny}
      out.push(r);
    }
    return out;
  },
  down(p,balls){
    const g=this.g;if(!g||g.ph!=='play')return;const i=this.myIndex();if(i<0)return;
    const pl=g.pl[i];
    if(onRim(p.x,p.y)){
      if(!(pl.jk>0)){toast('Keine Joker mehr übrig');sfx.bad();return}
      if(this.host)this.hostShake(myPeer());else this.gr.presence({sh:++this.shakes}).catch(()=>{});
      return;
    }
    if(pl.lk>0){toast(`Röhrchen gesperrt – noch ${fmt(pl.lk)} s`);return}
    if(this.pending)return;
    const b=ballAt(balls,p.x,p.y);if(!b)return;const t=this.cards&&this.cards[i]&&this.cards[i][pl.st];
    if(!matches(g.mode,b,t)){sfx.bad();FX.flashes.push({x:b.x,y:b.y,t:.5});toast(`Falsche Kugel – ${PEN} s gesperrt`);this.send(b.id);return}
    if(b.blocked){this.hold={ball:b,t:0};return}
    this.take(b);
  },
  take(b){
    const i=this.myIndex();this.pending={id:b.id,st0:this.g.pl[i].st,at:performance.now()};
    FX.flyers.push({b,x:b.x,y:b.y,t:0});sfx.pop();this.send(b.id);
  },
  send(id){if(this.host)this.hostPick(myPeer(),id);else this.gr.presence({pk:[++this.picks,id]}).catch(()=>{})},
  shakeBtn(){const g=this.g;if(!g||g.ph!=='play')return;const i=this.myIndex();if(i<0)return;if(!(g.pl[i].jk>0)){toast('Keine Joker mehr übrig');return}
    if(this.host)this.hostShake(myPeer());else this.gr.presence({sh:++this.shakes}).catch(()=>{})},

  tick(dt,now){
    if(this.view==='lobby'){this.renderLobby();draw({balls:idleBalls,interactive:false,jokers:0});
      renderSide({roundInfo:'Online',mode:'farben',card:[],step:0,label:'Zeit',jokers:3,canShake:false,players:[],emptyHint:'Eröffne ein Spiel oder tritt einem bei.'});return}
    if(this.host)this.hostTick(dt,now);
    this.readHost(now);
    const g=this.g, i=this.myIndex(), me=i>=0&&g?g.pl[i]:null;
    // Ereignisse aus dem Host-Zustand ableiten
    if(g){
      if(isInt(g.sk)&&g.sk!==this.lastSk){
        if(this.lastSk!==null&&g.sk>this.lastSk){WOB.t=.7;WOB.dir=+g.sd||0;sfx.shake();
          const who=g.pl&&g.pl[g.sb];if(who)toast(g.sb===i?'Gewackelt! Alle Kugeln bewegen sich':`${pname(who,g.sb)} hat gewackelt!`)}
        this.lastSk=g.sk}
      if(g.ph==='count'&&g.cd!==this.lastCd){this.lastCd=g.cd;if(g.cd)sfx.tick()}
      if(g.ph==='play'&&this.lastPh==='count'){sfx.go();say('Los!',true)}
      if(g.ph==='round'&&this.lastPh==='play'){if(g.win===i){sfx.win();say('Du hast die Karte gewonnen!',true)}else{sfx.lose();const w=g.pl&&g.pl[g.win];say(w?pname(w,g.win)+' war schneller.':'Runde vorbei.',true)}}
      if(me&&this.pending){if(me.st>this.pending.st0)this.pending=null;
        else if(Array.isArray(g.rm)&&g.rm.includes(this.pending.id)&&now-this.pending.at>250){this.pending=null;toast('Zu langsam – die Kugel war schon weg')}
        else if(now-this.pending.at>1200)this.pending=null}
      if(g.ph!=='play'){this.pending=null;this.hold=null}
      this.lastPh=g.ph;
    }
    const balls=this.clientBalls();computeBlocked(balls);lastBalls=balls;
    const playing=!!(g&&g.ph==='play'&&me);
    cv.classList.toggle('playing',playing);
    if(this.hold){const b=this.hold.ball;
      if(!balls.includes(b)||!mouse.down||(b.x-mouse.x)**2+(b.y-mouse.y)**2>(BR+10)**2||!playing)this.hold=null;
      else if(!b.blocked){this.hold=null;this.take(b)}else{this.hold.t+=dt;if(this.hold.t>=HOLD){this.hold=null;this.take(b)}}}
    // Röhrchen der anderen
    const others=[];
    if(g&&Array.isArray(g.pl)&&g.ph==='play'){for(const p of this.gr.peers()){if(p.sameTab)continue;const c=p.presence&&p.presence.c;if(!Array.isArray(c)||!isFinite(c[0])||!isFinite(c[1]))continue;
      const k=g.pl.findIndex(x=>x.p===p.peer);if(k<0)continue;others.push({x:+c[0],y:+c[1],col:PCOL[k],name:pname(g.pl[k],k)})}
      g.pl.forEach((p,k)=>{if(p.bot&&isFinite(p.cx)&&isFinite(p.cy))others.push({x:+p.cx,y:+p.cy,col:PCOL[k],name:pname(p,k)})})}
    draw({balls,interactive:playing,jokers:me?me.jk:0,countdown:g&&g.ph==='count'?g.cd:0,covered:!!(g&&g.ph==='count'),hold:this.hold,locked:me&&me.lk>0?me.lk:0,others});
    // Seitenleiste
    if(g&&Array.isArray(g.pl)){
      resolveNames(g.pl.map(p=>p.b));
      const peersNow=new Set(this.gr.peers().map(p=>p.peer));
      const card=this.cards&&i>=0?this.cards[i]:[];
      const step=me?Math.min(5,me.st+(this.pending?1:0)):0;
      $('timer').textContent=fmt(g.el);
      renderSide({roundInfo:g.rd?`Runde ${g.rd}/${g.rounds} · ${MODES[g.mode]||''}`:`Online · ${MODES[g.mode]||''}`,mode:g.mode,card:g.rd&&g.ph!=='count'?card:[],step,
        showCurrent:['play','count'].includes(g.ph),label:i>=0?(this.solo?'Zeit · Du':'Zeit · '+pname(me,i)+' (du)'):'Zuschauer',labelCol:i>=0?PCOL[i]:'',
        pen:me&&me.lk>0?`gesperrt ${fmt(me.lk)} s`:'',jokers:me?me.jk:0,canShake:playing&&me.jk>0,playersHead:'Kugeln · Karten · Joker',
        players:g.pl.map((p,k)=>({name:pname(p,k)+(k===i&&!this.solo?' (du)':'')+(p.p===g.hp&&!this.solo?' ★':''),col:PCOL[k],pts:p.pts|0,jk:p.jk|0,active:k===i,off:!p.bot&&!peersNow.has(p.p),prog:g.ph==='lobby'?null:p.st|0})),
        emptyHint:'Noch keine Spieler.'});
    }
    this.renderGameOverlay();
  },

  // ---------- Overlays ----------
  renderLobby(){
    const peers=NET.room?NET.room.peers():[];
    const games=peers.filter(p=>!p.sameTab&&p.presence&&p.presence.host&&typeof p.presence.host.code==='string'&&/^kb-[a-z0-9]{4}$/.test(p.presence.host.code));
    resolveNames(games.map(p=>p.by));
    const myNm=window.kbName?window.kbName.get():'';const twOn=!!(window.kbAuth&&window.kbAuth.enabled),twMe=!!(window.kbName&&window.kbName.verified());const key='lobby|'+myNm+'|'+twOn+twMe+'|'+games.map(p=>{const h=p.presence.host;return[h.code,h.n,h.ph,h.mode,NET.names[p.by]].join(',')}).join(';');
    if(key===this.okey)return;this.okey=key;
    const list=games.length?games.map(p=>{const h=p.presence.host,n=Math.min(4,h.n|0),open=h.ph==='lobby'&&n<4;
      return `<div class="game"><div style="min-width:0"><div class="t">Spiel von ${esc((p.by&&NET.names[p.by])||'jemandem')}</div>
        <div class="s">${esc(MODES[h.mode]||'')} · ${h.rounds|0} Runden · ${n}/4 Spieler · ${h.ph==='lobby'?'wartet':'läuft'}</div></div>
        <button class="btn small ${open?'':'line'}" type="button" data-code="${esc(h.code)}">${open?'Mitspielen':'Zuschauen'}</button></div>`}).join('')
      :`<div class="empty">Gerade ist kein offenes Spiel da. Eröffne eins – deine Mitspieler sehen es dann hier.</div>`;
    sheet(`<div class="label">Online</div><h2>Spiel finden</h2>
      <p>Alle, die diese Seite gerade geöffnet haben, sehen hier offene Spiele.</p>${myNm?`<div class="game"><div style="min-width:0"><div class="s">Dein Name</div><div class="t">${esc(myNm)}${twMe?' <span style="color:var(--ok)" title="Mit Twitch angemeldet">✓ Twitch</span>':''}</div></div>${twMe?`<a class="btn small line" href="/auth/logout?r=/kugelblitz/" style="text-decoration:none">Abmelden</a>`:`<div class="row" style="gap:6px">${twOn?`<a class="btn small" href="/auth/twitch/login?r=/kugelblitz/" style="text-decoration:none;background:#9146FF;color:#fff;box-shadow:none">Mit Twitch einloggen</a>`:''}<button class="btn small line" type="button" id="reroll">Neuer Name</button></div>`}</div>`:''}
      <div class="games" id="games">${list}</div>
      <div class="row"><button class="btn" id="create" type="button">Neues Spiel eröffnen</button><button class="btn line" id="back" type="button">Zurück</button></div>`);
    $('create').onclick=()=>{audio();this.create()};if($('reroll'))$('reroll').onclick=()=>{window.kbName.reroll();Object.keys(NET.names).forEach(k=>delete NET.names[k]);NET.asked.clear();this.okey=''};$('back').onclick=showMenu;
    $('games').onclick=e=>{const b=e.target.closest('button[data-code]');if(b){audio();this.join(b.dataset.code)}};
  },
  renderGameOverlay(){
    const g=this.g, i=this.myIndex();
    if(this.hostGone&&!this.host){
      const key='gone';if(this.okey===key)return;this.okey=key;
      sheet(`<h2>Die Spielleitung ist weg</h2><p>Es ist niemand mehr da, der das Spiel übernehmen kann.</p><button class="btn" id="back" type="button">Zurück zur Spielsuche</button>`);
      $('back').onclick=()=>{this.leave();};return;
    }
    if(!g){const key='wait';if(this.okey===key)return;this.okey=key;
      sheet(`<h2>Verbinde mit dem Spiel …</h2><p>Einen Moment.</p><button class="btn line" id="back" type="button">Abbrechen</button>`);$('back').onclick=()=>this.leave();return}
    const names=(g.pl||[]).map((p,k)=>pname(p,k));
    const key=[g.ph,g.mode,g.rounds,g.rd,g.win,i,this.host,this.solo,g.hp,names.join(','),(g.pl||[]).map(p=>p.pts).join(',')].join('|');
    if(key===this.okey)return;this.okey=key;
    const plist=`<table class="res">${names.map((n,k)=>`<tr><td><span style="color:${PCOL[k]}">●</span> ${esc(n)}${k===i&&!this.solo?' (du)':''}${g.pl[k].p===g.hp&&!this.solo?' · Spielleitung':''}${g.pl[k].bot?' · '+(BOTLV[g.pl[k].lv]||BOTLV[2]).label:''}</td><td>${g.pl[k].bot&&this.host&&g.ph==='lobby'?`<button class="btn small line" type="button" data-rmbot="${esc(g.pl[k].p)}">Entfernen</button>`:''}</td></tr>`).join('')}</table>`;
    if(g.ph==='lobby'){
      if(this.host){
        const H=this.H;
        const botUi=names.length<4?`<div class="field"><span class="label">Bot hinzufügen</span><div class="botrow"><button class="btn small line" type="button" data-bot="1">+ Leicht</button><button class="btn small line" type="button" data-bot="2">+ Normal</button><button class="btn small line" type="button" data-bot="3">+ Schwer</button></div></div>`:'';
        sheet(`<div class="label">${this.solo?'Solo gegen Bots':'Warteraum'} · ${names.length}/4 Spieler</div><h2>${this.solo?'Dein Solo-Spiel':'Dein Online-Spiel'}</h2>${plist}${botUi}
          <div class="field"><span class="label">Aufgabenkarten</span>${seg(H.g,'mode',[['farben','Farben'],['zahlen','Zahlen'],['rechnen','Rechnen']],()=>{this.okey='x'})}</div>
          <div class="field"><span class="label">Runden</span>${seg(H.g,'rounds',[[3,'3'],[5,'5'],[7,'7']],()=>{this.okey='x'})}</div>
          <p>${names.length<2?(this.solo?'Füge mindestens einen Bot hinzu.':'Warte auf Mitspieler: Sie öffnen diese Seite, wählen „Online“ und klicken bei deinem Spiel auf „Mitspielen“ – oder füge Bots hinzu.'):'Alle bereit? Dann los.'}</p>
          <div class="row"><button class="btn" id="start" type="button" ${names.length<2?'disabled':''}>Spiel starten</button><button class="btn line" id="back" type="button">Verlassen</button></div>`);
        $('start').onclick=()=>{audio();this.hostStartGame()};
        overlay.querySelectorAll('[data-bot]').forEach(b=>b.onclick=()=>{this.addBot(+b.dataset.bot)});
        overlay.querySelectorAll('[data-rmbot]').forEach(b=>b.onclick=()=>{this.removeBot(b.dataset.rmbot)});
      }else{
        sheet(`<div class="label">Warteraum · ${names.length}/4 Spieler</div><h2>${i>=0?'Du bist dabei':'Du schaust zu'}</h2>${plist}
          <p>${MODES[g.mode]||''} · ${g.rounds|0} Runden. Die Spielleitung startet das Spiel.</p>
          <button class="btn line" id="back" type="button">Verlassen</button>`);
      }
      $('back').onclick=()=>this.leave();return;
    }
    if(g.ph==='count'||g.ph==='play'){overlay.innerHTML='';return}
    if(g.ph==='round'){
      const w=g.pl[g.win],wn=w?pname(w,g.win):'?',last=g.rd>=g.rounds;
      const rows=g.pl.map((p,k)=>({k,n:pname(p,k),st:p.st|0,pts:p.pts|0})).sort((a,b)=>b.st-a.st);
      sheet(`<div class="label">Runde ${g.rd} von ${g.rounds}</div><h2 style="color:${PCOL[g.win]||'inherit'}">${g.win===i?'Du gewinnst die Karte!':esc(wn)+' gewinnt die Karte'}</h2>
        <p>Fertig nach ${fmt(g.el)} Sekunden.</p>
        <table class="res">${rows.map(r=>`<tr class="${r.k===g.win?'win':''}"><td><span style="color:${PCOL[r.k]}">●</span> ${esc(r.n)}</td><td>${r.st}/5 Kugeln · ${r.pts} ${r.pts===1?'Karte':'Karten'}</td></tr>`).join('')}</table>
        ${this.host?`<button class="btn" id="go" type="button">${last?'Endstand anzeigen':'Nächste Karte ziehen'}</button>`:`<p>Die Spielleitung zieht die nächste Karte.</p>`}`);
      if(this.host)$('go').onclick=()=>{audio();this.hostNextRound()};return;
    }
    if(g.ph==='over'){
      const order=g.pl.map((p,k)=>({k,n:pname(p,k),pts:p.pts|0})).sort((a,b)=>b.pts-a.pts);
      const top=order.filter(o=>o.pts===order[0].pts);
      sheet(`<div class="label">Endstand nach ${g.rounds} Runden</div><h2 style="color:${PCOL[top[0].k]}">${top.length>1?'Unentschieden: '+top.map(o=>esc(o.n)).join(' & '):esc(top[0].n)+' gewinnt!'}</h2>
        <table class="res">${order.map((o,r)=>`<tr class="${o.pts===order[0].pts?'win':''}"><td>${r+1}. <span style="color:${PCOL[o.k]}">●</span> ${esc(o.n)}</td><td>${o.pts} ${o.pts===1?'Karte':'Karten'}</td></tr>`).join('')}</table>
        <div class="row">${this.host?`<button class="btn" id="again" type="button">Neue Partie</button>`:''}<button class="btn line" id="back" type="button">Verlassen</button></div>`);
      if(this.host)$('again').onclick=()=>{const g2=this.H.g;g2.ph='lobby';g2.rd=0;g2.seed=0;this.H.balls=[];g2.rm=[];this.H.bots={};};
      $('back').onclick=()=>this.leave();sfx.fanfare();return;
    }
  }
};

// ================= Eingabe =================
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*W/r.height}}
let lastBalls=[];
let lastCursorSent=0;
cv.addEventListener('pointermove',e=>{const p=pos(e);mouse.x=p.x;mouse.y=p.y;mouse.in=true;
  if(APP==='online'&&ON.gr&&ON.g&&ON.g.ph==='play'){const n=performance.now();if(n-lastCursorSent>60){lastCursorSent=n;ON.gr.presence({c:[Math.round(p.x),Math.round(p.y)]}).catch(()=>{})}}});
cv.addEventListener('pointerleave',()=>{mouse.in=false;mouse.down=false;if(APP==='online'&&ON.gr)ON.gr.presence({c:null}).catch(()=>{})});
cv.addEventListener('pointerdown',e=>{audio();const p=pos(e);mouse.x=p.x;mouse.y=p.y;mouse.in=true;mouse.down=true;
  if(APP==='local'&&LO.S)LO.down(p);else if(APP==='online'&&ON.gr)ON.down(p,lastBalls)});
window.addEventListener('pointerup',()=>{mouse.down=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
if(window.LZSound)LZSound.mountToggle($('muteBtn'));
$('btnShake').onclick=()=>{audio();if(APP==='local')LO.joker();else if(APP==='online')ON.shakeBtn()};
// Tastatur: Leertaste/J = Joker (Wackeln), 1–3 = Auswahl im Menü, Enter = Knopf in der Overlay-Karte.
// Das Greifen der Kugeln bleibt bewusst Maus/Touch – das ist der Kern des Geschicklichkeitsspiels.
if(window.LZCozy)LZCozy.keys(e=>{
  const ae=document.activeElement,onBtn=ae&&ae!==document.body&&ae.matches('button,a');
  if((e.key===' '&&!onBtn)||e.key==='j'||e.key==='J'){const b=$('btnShake');if(b&&!b.disabled){e.preventDefault();b.click()}return}
  if(/^[1-9]$/.test(e.key)){const c=overlay.querySelectorAll('.choice:not([disabled]),.seg button')[+e.key-1];if(c&&overlay.querySelector('.choice')){e.preventDefault();c.click()}return}
  if(e.key==='Enter'&&!onBtn){const b=overlay.querySelector('.btn:not([disabled])');if(b){e.preventDefault();b.click()}}
});
function leaveWarning(){
  if(APP==='online'&&ON.inGame()){
    if(ON.solo)return ['Solo-Spiel beenden?','Die laufende Partie gegen die Bots wird beendet.','Beenden'];
    if(ON.host)return ['Spiel wirklich verlassen?','Du leitest gerade das Spiel. Wenn du gehst, übernimmt automatisch jemand anderes die Leitung.','Verlassen'];
    return ['Spiel wirklich verlassen?','Du verlässt die laufende Partie. Deine Mitspieler spielen ohne dich weiter.','Verlassen'];
  }
  if(APP==='local'&&LO.S&&!['setup','over'].includes(LO.S.phase))return ['Spiel abbrechen?','Die laufende Partie am selben Computer wird beendet.','Abbrechen'];
  return null;
}
$('btnNew').onclick=()=>{audio();const w=leaveWarning();if(w)askConfirm(w[0],w[1],w[2],showMenu);else showMenu()};
document.addEventListener('click',e=>{const a=e.target.closest('a[data-home]');if(!a)return;const w=leaveWarning();if(w){e.preventDefault();askConfirm(w[0],w[1],w[2],()=>{if(APP==='online')ON.leave(true);location.href=a.href})}});
window.addEventListener('beforeunload',e=>{if(APP==='online'&&!ON.solo&&ON.inGame()){e.preventDefault();e.returnValue=''}});

// ================= Schleife =================
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(WOB.t>0)WOB.t=Math.max(0,WOB.t-dt);
  FX.flashes.forEach(f=>f.t-=dt);FX.flashes=FX.flashes.filter(f=>f.t>0);
  FX.flyers.forEach(f=>f.t+=dt*3);FX.flyers=FX.flyers.filter(f=>f.t<1);
  try{
    if(APP==='local'&&LO.S&&LO.S.phase!=='setup')LO.tick(dt,now);
        else if(APP==='online'){ON.tick(dt,now)}
    else{stepSim(dt,idleBalls);computeBlocked(idleBalls);draw({balls:idleBalls,interactive:false,jokers:0})}
  }catch(err){console.error(err)}
  if(APP==='online'&&ON.view==='game'&&ON.host&&ON.H)WOB.t=Math.max(WOB.t,SHAKE.t);
  requestAnimationFrame(loop);
}

// Spielleiter-Tab im Hintergrund: Simulation trotzdem weiterlaufen lassen (Browser drosseln das)
setInterval(()=>{if(document.hidden&&APP==='online'&&ON.host&&ON.gr&&ON.H){const now=performance.now();const dt=Math.min(.25,(now-last)/1000);last=now;try{ON.hostTick(dt,now)}catch(e){}}},100);

// ================= Netz verbinden =================
function setPill(){const p=$('netpill');if(NET.room){p.hidden=false;p.className='netpill ok';p.textContent='Online bereit'}else p.hidden=true}
(async()=>{
  const c=window.claude;
  if(!c||typeof c.use!=='function'){NET.state='off';if(APP==='menu')showMenu();return}
  try{NET.user=await c.use('user')}catch(e){}
  try{
    const room=await c.use('room');
    if(room){NET.room=room;room.onPeers(()=>{},()=>{NET.room=null;setPill();if(APP==='online'){ON.leave(true);showMenu()}})}
  }catch(e){}
  NET.state=NET.room?'on':'off';setPill();
  window.addEventListener('kbauth',()=>{ON.okey=''});
  // Direkt-Link von der Startseite (?join=CODE): sofort beitreten
  { const jn=new URLSearchParams(location.search).get('join'); if(jn&&NET.room&&/^kb-[a-z0-9]{4}$/.test(jn)){history.replaceState(null,'',location.pathname);ON.lobby();ON.join(jn);return} }
  if(APP==='menu')showMenu();
})();

showMenu();
requestAnimationFrame(loop);
})();
</script>
